<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Soccer</title>

    <style>
        body {
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: #e8f0eb;
            color: #17332a;
            margin: 0;
            padding: clamp(14px, 4vw, 48px);
        }

        .container {
            max-width: 1080px;
            margin: auto;
            background: white;
            padding: clamp(20px, 4vw, 42px);
            border: 1px solid #d4e2d8;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(20, 60, 43, 0.1);
        }

        h1 {
            margin: 0 0 8px;
            color: #123d2b;
            font-size: clamp(32px, 5vw, 52px);
            letter-spacing: -1px;
        }

        h2 {
            margin: 34px 0 16px;
            color: #1c4d38;
            font-size: clamp(22px, 3vw, 30px);
        }

        h1::after {
            content: "MATCHDAY CONTROL CENTER";
            display: block;
            margin-top: 8px;
            color: #e0733c;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        .itinerary-form {
            gap: 18px;
            margin-top: 20px;
            padding: clamp(18px, 3vw, 28px);
            background: #f3f8f4;
            border: 1px solid #dce9df;
            border-radius: 14px;
        }

        .itinerary-form-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .itinerary-form-header h3,
        .itinerary-form-header p {
            margin: 0;
        }

        .itinerary-form-header h3 {
            color: #164b35;
            font-size: 20px;
        }

        .itinerary-form-header p {
            max-width: 520px;
            color: #5d7467;
            font-size: 14px;
        }

        .itinerary-fields {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 14px;
        }

        .itinerary-field {
            display: grid;
            gap: 6px;
        }

        .itinerary-field label {
            color: #28503d;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.7px;
            text-transform: uppercase;
        }

        .itinerary-field label span {
            color: #789083;
            font-weight: normal;
            letter-spacing: 0;
            text-transform: none;
        }

        .itinerary-field.day,
        .itinerary-field.date,
        .itinerary-field.time {
            grid-column: span 4;
        }

        .itinerary-field.activity,
        .itinerary-field.location,
        .itinerary-field.coach {
            grid-column: span 4;
        }

        .itinerary-field.notes {
            grid-column: 1 / -1;
        }

        .itinerary-form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .itinerary-form-actions button {
            min-width: 180px;
        }

        .itinerary-form-actions button[type="button"] {
            background: transparent;
            color: #164b35;
        }

        input,
        textarea,
        button {
            border: 1px solid #cbdcd0;
            border-radius: 8px;
            padding: 11px 13px;
            font-size: 16px;
        }

        input,
        textarea,
        select {
            background: #fbfdfb;
            color: #17332a;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            background: #164b35;
            color: white;
            border-color: #164b35;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 160ms ease, transform 160ms ease;
        }

        button:hover {
            background: #0e3827;
            transform: translateY(-1px);
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 3px solid #4d90fe;
            outline-offset: 2px;
        }

        button.danger {
            background: #b42318;
        }

        button.danger:hover {
            background: #8f1c13;
        }

        .empty-state {
            color: #666;
            text-align: center;
            padding: 18px;
            margin-top: 15px;
            border: 1px dashed #bbb;
            border-radius: 8px;
        }

        .status-message {
            min-height: 22px;
            margin: 12px 0 0;
            color: #8f1c13;
            font-weight: bold;
        }

        .season-tools,
        .team-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 16px;
        }

        .season-tools button,
        .team-filter input {
            flex: 1;
            min-width: 160px;
        }

        .season-tools input[type="file"] {
            display: none;
        }

        .season-tools label {
            flex: 1;
            min-width: 160px;
            padding: 10px;
            border-radius: 6px;
            background: #164b35;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        .team-heading,
        .matchup-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .team-heading h3,
        .matchup-heading strong {
            margin: 0;
        }

        .team-actions,
        .matchup-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .team-actions button,
        .matchup-actions button {
            flex: 1;
            min-width: 120px;
        }

        .matchup-actions button.selected {
            background: #16803c;
        }

        .completed {
            opacity: 0.7;
            border-left-color: #16803c;
        }

        .completed .matchup-heading strong {
            text-decoration: line-through;
        }

        .view-tabs {
            display: flex;
            gap: 8px;
            margin: 22px 0;
            border-bottom: 1px solid #ddd;
        }

        .view-tab {
            flex: 1;
            border-radius: 6px 6px 0 0;
            background: #edf4ef;
            color: #28503d;
        }

        .view-tab.active {
            background: #e0733c;
            color: white;
        }

        .view-panel[hidden] {
            display: none;
        }

        .field-summary {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin: 18px 0;
            padding: 14px;
            background: #edf5ef;
            border: 1px solid #d5e5d9;
            border-radius: 8px;
        }

        .field-summary strong {
            font-size: 20px;
        }

        .soccer-field {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            min-height: 430px;
            overflow: hidden;
            border: 5px solid #f9fff9;
            border-radius: 14px;
            background: linear-gradient(90deg, transparent calc(50% - 1px), rgba(255, 255, 255, 0.85) calc(50% - 1px), rgba(255, 255, 255, 0.85) calc(50% + 1px), transparent calc(50% + 1px)), repeating-linear-gradient(90deg, #287a43 0, #287a43 9%, #2f874b 9%, #2f874b 18%);
            box-shadow: inset 0 0 0 2px #1d5c32, 0 12px 24px rgba(20, 60, 43, 0.2);
            color: white;
        }

        .soccer-field::before {
            content: "";
            position: absolute;
            inset: 8% 0;
            border-top: 2px solid rgba(255, 255, 255, 0.8);
            border-bottom: 2px solid rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }

        .soccer-field::after {
            content: "";
            position: absolute;
            width: 110px;
            height: 110px;
            left: 50%;
            top: 50%;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .field-goal {
            position: absolute;
            top: 50%;
            z-index: 3;
            width: 48px;
            height: 142px;
            border: 3px solid rgba(255, 255, 255, 0.95);
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.22) 0 2px, transparent 2px 10px), repeating-linear-gradient(90deg, rgba(255,255,255,0.2) 0 2px, transparent 2px 10px), rgba(15, 67, 37, 0.22);
            transform: translateY(-50%);
            box-shadow: inset 0 0 0 2px rgba(14, 56, 34, 0.35);
            pointer-events: none;
        }

        .field-goal.home {
            left: -3px;
            border-left: 0;
            border-radius: 0 6px 6px 0;
        }

        .field-goal.away {
            right: -3px;
            border-right: 0;
            border-radius: 6px 0 0 6px;
        }

        .field-side {
            position: relative;
            z-index: 1;
            min-width: 0;
            padding: 26px 18px;
            text-align: center;
        }

        .field-side.home {
            border-right: 1px solid rgba(255, 255, 255, 0.45);
        }

        .field-side.away {
            border-left: 1px solid rgba(255, 255, 255, 0.45);
        }

        .field-label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .field-team-name {
            display: block;
            overflow-wrap: anywhere;
            font-size: clamp(20px, 4vw, 34px);
            font-weight: bold;
        }

        .field-score {
            display: block;
            margin-top: 12px;
            font-size: clamp(46px, 9vw, 82px);
            line-height: 1;
            font-weight: bold;
        }

        .field-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        .field-controls button {
            min-width: 120px;
        }

        .field-queue {
            display: grid;
            gap: 8px;
            margin-top: 18px;
        }

        .queue-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            border-radius: 6px;
            background: #f3f8f4;
        }

        .queue-item.next {
            border-left: 4px solid #16803c;
            font-weight: bold;
        }

        .itinerary-item {
            background: #f6faf7;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            border-left: 5px solid #e0733c;
        }

        .itinerary-card {
            display: grid;
            grid-template-columns: minmax(150px, 0.8fr) 1.6fr auto;
            gap: 18px;
            align-items: start;
            padding: 18px;
        }

        .itinerary-date {
            color: #164b35;
            font-size: 18px;
            font-weight: bold;
        }

        .itinerary-time {
            display: block;
            margin-top: 5px;
            color: #e0733c;
            font-size: 14px;
        }

        .itinerary-details strong {
            display: block;
            margin-bottom: 7px;
            color: #17332a;
            font-size: 19px;
        }

        .itinerary-meta,
        .itinerary-notes {
            margin: 5px 0 0;
            color: #5d7467;
            font-size: 14px;
        }

        .itinerary-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .itinerary-actions button {
            min-width: 88px;
        }

        .team-controls {
            display: grid;
            gap: 12px;
            margin-top: 20px;
            padding: 20px;
            background: #f3f8f4;
            border-radius: 8px;
        }

        .team-controls form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .team-controls input,
        .team-controls select {
            flex: 1;
            min-width: 180px;
        }

        .teams {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .team {
            flex: 1;
            min-width: 260px;
            background: #f6faf7;
            padding: 15px;
            border-radius: 8px;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .team button {
            margin-top: 5px;
        }

        .matchup-actions {
            margin-top: 12px;
        }

        .rotation {
            margin-top: 20px;
        }

        /* =============================
           MOBILE-ONLY FRIENDLY LAYOUT
           ============================= */
        @media (max-width: 700px) {
            body {
                padding: 10px;
                font-size: 16px;
                -webkit-text-size-adjust: 100%;
            }

            .container {
                width: 100%;
                max-width: none;
                box-sizing: border-box;
                padding: 16px;
                border-radius: 10px;
            }

            h1 {
                font-size: 28px;
                margin: 8px 0 20px;
            }

            h2 {
                font-size: 22px;
                margin-top: 24px;
            }

            h3 {
                font-size: 19px;
            }

            form,
            .team-controls form {
                display: flex;
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }

            .itinerary-form {
                display: grid;
                gap: 16px;
                padding: 16px;
            }

            .itinerary-form-header {
                display: block;
            }

            .itinerary-fields {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .itinerary-field.day,
            .itinerary-field.date,
            .itinerary-field.time,
            .itinerary-field.activity,
            .itinerary-field.location,
            .itinerary-field.coach {
                grid-column: span 1;
            }

            .itinerary-field.notes {
                grid-column: 1 / -1;
            }

            .itinerary-form-actions {
                display: grid;
            }

            .itinerary-form-actions button {
                width: 100%;
            }

            .itinerary-card {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 16px;
            }

            .itinerary-actions {
                display: flex;
                flex-direction: row;
            }

            .itinerary-actions button {
                flex: 1;
            }

            input,
            textarea,
            select,
            button {
                width: 100%;
                min-height: 48px;
                box-sizing: border-box;
                font-size: 17px;
                padding: 12px;
                margin: 0;
            }

            textarea {
                min-height: 110px;
            }

            button {
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
            }

            .team-controls {
                padding: 12px;
                margin-top: 15px;
            }

            .team-controls input,
            .team-controls select {
                min-width: 0;
                width: 100%;
            }

            .season-tools,
            .team-filter {
                flex-direction: column;
                align-items: stretch;
            }

            .season-tools button,
            .season-tools label,
            .team-filter input {
                width: 100%;
                min-width: 0;
                box-sizing: border-box;
            }

            .teams {
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin-top: 15px;
            }

            .team {
                width: 100%;
                min-width: 0;
                box-sizing: border-box;
                padding: 14px;
            }

            .team ul {
                padding-left: 22px;
                margin-bottom: 12px;
            }

            .team li {
                margin-bottom: 8px;
                overflow-wrap: anywhere;
            }

            .team li button {
                width: auto;
                min-width: 80px;
                min-height: 42px;
                margin-left: 5px;
                padding: 8px 12px;
                font-size: 15px;
            }

            .score {
                font-size: 40px;
                margin: 12px 0;
            }

            .team button {
                margin-top: 5px;
            }

            .rotation {
                width: 100%;
                margin-top: 15px;
            }

            .itinerary-item {
                padding: 13px;
                margin-top: 10px;
                overflow-wrap: anywhere;
            }

            #matchups {
                width: 100%;
            }

            .soccer-field {
                min-height: 360px;
                border-width: 4px;
            }

            .field-goal {
                width: 30px;
                height: 112px;
            }

            .field-team-name {
                font-size: clamp(17px, 6vw, 26px);
            }

            .field-score {
                font-size: clamp(42px, 14vw, 66px);
            }

            .field-summary {
                align-items: flex-start;
                flex-direction: column;
            }

            .queue-item {
                align-items: flex-start;
                flex-direction: column;
            }

            /* Makes date/time controls easier to use on phones */
            input[type="date"],
            input[type="time"] {
                min-height: 50px;
            }
        }

        /* Extra-small phones */
        @media (max-width: 380px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 12px;
            }

            h1 {
                font-size: 25px;
            }

            h2 {
                font-size: 20px;
            }

            input,
            textarea,
            select,
            button {
                font-size: 16px;
            }
        }


        .mobile-only-tools {
            display: none;
        }

        @media (max-width: 700px) {
            .mobile-only-tools {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin: 0 0 18px;
                padding: 10px 12px;
                background: #f3f8f4;
                border-radius: 8px;
                font-size: 14px;
                text-align: center;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>School Soccer</h1>

    <section class="season-tools" aria-label="Season tools">
        <button id="exportButton" type="button">Export Season</button>
        <label for="importInput">Import Season</label>
        <input id="importInput" type="file" accept="application/json">
        <button id="clearDataButton" class="danger" type="button">Clear All Data</button>
    </section>
    <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>

    <nav class="view-tabs" aria-label="Dashboard views">
        <button class="view-tab active" type="button" data-view="dashboardView" aria-selected="true">Manage</button>
        <button class="view-tab" type="button" data-view="fieldView" aria-selected="false">Field View</button>
    </nav>

    <section id="dashboardView" class="view-panel">

    <!-- ITINERARY -->
    <h2>Itinerary</h2>

    <form id="itineraryForm" class="itinerary-form">
        <div class="itinerary-form-header">
            <div>
                <h3 id="itineraryFormTitle">Add a matchday event</h3>
                <p>Build the schedule for training, games, travel, and team activities.</p>
            </div>
        </div>

        <div class="itinerary-fields">
            <div class="itinerary-field day">
                <label for="day">Day</label>
                <input type="text" id="day" placeholder="e.g. Saturday" required>
            </div>
            <div class="itinerary-field date">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="itinerary-field time">
                <label for="time">Start time</label>
                <input type="time" id="time" required>
            </div>
            <div class="itinerary-field activity">
                <label for="activity">Activity</label>
                <input type="text" id="activity" placeholder="e.g. Home game" required>
            </div>
            <div class="itinerary-field location">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="e.g. Main field" required>
            </div>
            <div class="itinerary-field coach">
                <label for="coach">Coach / contact</label>
                <input type="text" id="coach" placeholder="e.g. Coach Taylor" required>
            </div>
            <div class="itinerary-field notes">
                <label for="notes">Notes <span>(optional)</span></label>
                <textarea id="notes" placeholder="Add arrival details, equipment reminders, or other notes"></textarea>
            </div>
        </div>

        <div class="itinerary-form-actions">
            <button id="itinerarySubmit" type="submit">Add Itinerary Item</button>
            <button id="itineraryCancel" type="button" hidden>Cancel Edit</button>
        </div>

    </form>


    <!-- DISPLAY ITINERARY -->
    <h2>School Soccer Itinerary</h2>

    <div id="itineraryList"></div>


    <!-- TEAMS -->
    <h2>Teams</h2>

    <section class="team-controls">
        <form id="teamForm">
            <input type="text" id="teamName" placeholder="Team name" required>
            <input type="text" id="teamPlayers" placeholder="Players separated by commas">
            <button type="submit">Add Team</button>
        </form>

        <form id="playerForm">
            <select id="teamSelect" required></select>
            <input type="text" id="newPlayers" placeholder="Add players separated by commas" required>
            <button type="submit">Add Players</button>
        </form>
    </section>

    <div class="teams" id="teamsDisplay"></div>

    <div class="team-filter">
        <input type="search" id="teamSearch" placeholder="Search teams or players" aria-label="Search teams or players">
    </div>

    <button class="rotation" id="randomizeButton" type="button">
        Make Matchups
    </button>
    
    <div id="matchups"></div>

    </section>

    <section id="fieldView" class="view-panel" hidden>
        <h2>Live Soccer Field</h2>
        <div id="fieldSummary" class="field-summary"></div>
        <div id="soccerField" class="soccer-field" aria-live="polite"></div>
        <div id="fieldControls" class="field-controls"></div>
        <div id="fieldQueue" class="field-queue"></div>
    </section>

</div>


<script>
    const STORAGE_KEY = "school-soccer-season-v1";
    let editingItineraryId = null;
    let state = loadState();

    function defaultState() {
        return {
            teams: ["Team A", "Team B"],
            scores: {"Team A": 0, "Team B": 0},
            players: {
                "Team A": ["Player 1", "Player 2", "Player 3"],
                "Team B": ["Player 4", "Player 5", "Player 6"]
            },
            itinerary: [],
            matchups: [],
            selectedMatchup: null
        };
    }

    function loadState() {
        try {
            let saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            return normalizeState(saved || defaultState());
        } catch (error) {
            return defaultState();
        }
    }

    function normalizeState(value) {
        let fallback = defaultState();
        if (!value || !Array.isArray(value.teams)) {
            return fallback;
        }

        let teams = value.teams.filter(team => typeof team === "string" && team.trim());
        let scores = {};
        let players = {};
        teams.forEach(team => {
            scores[team] = Number.isFinite(Number(value.scores?.[team])) ? Math.max(0, Number(value.scores[team])) : 0;
            players[team] = Array.isArray(value.players?.[team])
                ? value.players[team].filter(player => typeof player === "string" && player.trim())
                : [];
        });

        return {
            teams,
            scores,
            players,
            itinerary: Array.isArray(value.itinerary) ? value.itinerary.map(item => ({
                id: item.id || `${Date.now()}-${Math.random()}`,
                day: item.day || "",
                date: item.date || "",
                time: item.time || "",
                activity: item.activity || "",
                location: item.location || "",
                coach: item.coach || "",
                notes: item.notes || ""
            })) : [],
            matchups: Array.isArray(value.matchups) ? value.matchups
                .filter(matchup => matchup && teams.includes(matchup.home))
                .map(matchup => ({
                    home: matchup.home,
                    away: matchup.away && teams.includes(matchup.away) ? matchup.away : null,
                    homeScore: Math.max(0, Number(matchup.homeScore) || 0),
                    awayScore: Math.max(0, Number(matchup.awayScore) || 0),
                    completed: Boolean(matchup.completed)
                })) : [],
            selectedMatchup: Number.isInteger(value.selectedMatchup) && value.selectedMatchup >= 0 && value.selectedMatchup < (value.matchups || []).length
                ? value.selectedMatchup
                : null
        };
    }

    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function setStatus(message, isError = true) {
        let status = document.getElementById("statusMessage");
        status.textContent = message;
        status.style.color = isError ? "#8f1c13" : "#16803c";
        if (message) {
            window.setTimeout(() => {
                if (status.textContent === message) status.textContent = "";
            }, 3500);
        }
    }

    function normalizeNames(input) {
        return input.split(",").map(name => name.trim()).filter(Boolean);
    }

    function hasName(list, name) {
        return list.some(item => item.toLowerCase() === name.toLowerCase());
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>'"]/g, character => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
        }[character]));
    }

    function commit(message) {
        saveState();
        renderAll();
        if (message) setStatus(message, false);
    }

    document.getElementById("teamForm").addEventListener("submit", event => {
        event.preventDefault();
        let name = document.getElementById("teamName").value.trim();
        let newPlayers = normalizeNames(document.getElementById("teamPlayers").value);
        if (hasName(state.teams, name)) {
            setStatus("That team name already exists.");
            return;
        }
        state.teams.push(name);
        state.scores[name] = 0;
        state.players[name] = newPlayers;
        event.target.reset();
        commit(`${name} added.`);
    });

    document.getElementById("playerForm").addEventListener("submit", event => {
        event.preventDefault();
        let team = document.getElementById("teamSelect").value;
        let additions = normalizeNames(document.getElementById("newPlayers").value);
        let existing = state.players[team] || [];
        let unique = additions.filter(player => !hasName(existing, player));
        if (!team || unique.length === 0) {
            setStatus("Choose a team and enter at least one new player.");
            return;
        }
        state.players[team] = existing.concat(unique);
        event.target.reset();
        commit("Players added.");
    });

    document.getElementById("itineraryForm").addEventListener("submit", event => {
        event.preventDefault();
        let item = {
            id: editingItineraryId || Date.now().toString(),
            day: document.getElementById("day").value.trim(),
            date: document.getElementById("date").value,
            time: document.getElementById("time").value,
            activity: document.getElementById("activity").value.trim(),
            location: document.getElementById("location").value.trim(),
            coach: document.getElementById("coach").value.trim(),
            notes: document.getElementById("notes").value.trim()
        };
        let existingIndex = state.itinerary.findIndex(entry => entry.id === editingItineraryId);
        if (existingIndex >= 0) state.itinerary[existingIndex] = item;
        else state.itinerary.push(item);
        resetItineraryForm();
        commit(existingIndex >= 0 ? "Itinerary item updated." : "Itinerary item added.");
    });

    document.getElementById("itineraryCancel").addEventListener("click", resetItineraryForm);

    function resetItineraryForm() {
        editingItineraryId = null;
        document.getElementById("itineraryForm").reset();
        document.getElementById("itinerarySubmit").textContent = "Add Itinerary Item";
        document.getElementById("itineraryFormTitle").textContent = "Add a matchday event";
        document.getElementById("itineraryCancel").hidden = true;
    }

    function editItinerary(id) {
        let item = state.itinerary.find(entry => entry.id === id);
        if (!item) return;
        editingItineraryId = id;
        Object.keys(item).forEach(key => {
            let field = document.getElementById(key);
            if (field) field.value = item[key] || "";
        });
        document.getElementById("itinerarySubmit").textContent = "Save Itinerary Changes";
        document.getElementById("itineraryFormTitle").textContent = "Edit matchday event";
        document.getElementById("itineraryCancel").hidden = false;
        document.getElementById("day").focus();
    }

    function deleteItinerary(id) {
        if (!confirm("Delete this itinerary item?")) return;
        state.itinerary = state.itinerary.filter(item => item.id !== id);
        commit("Itinerary item deleted.");
    }

    function updateScore(team, points) {
        state.scores[team] = Math.max(0, (state.scores[team] || 0) + points);
        commit();
    }

    function renameTeam(team) {
        let newName = prompt("New team name:", team)?.trim();
        if (!newName || newName === team) return;
        if (hasName(state.teams.filter(item => item !== team), newName)) {
            setStatus("That team name already exists.");
            return;
        }
        let index = state.teams.indexOf(team);
        state.teams[index] = newName;
        state.scores[newName] = state.scores[team] || 0;
        state.players[newName] = state.players[team] || [];
        delete state.scores[team];
        delete state.players[team];
        state.matchups.forEach(matchup => {
            if (matchup.home === team) matchup.home = newName;
            if (matchup.away === team) matchup.away = newName;
        });
        commit(`${newName} renamed.`);
    }

    function deleteTeam(team) {
        if (!confirm(`Delete ${team} and all of its players?`)) return;
        state.teams = state.teams.filter(item => item !== team);
        delete state.scores[team];
        delete state.players[team];
        state.matchups = state.matchups.filter(matchup => matchup.home !== team && matchup.away !== team);
        commit(`${team} deleted.`);
    }

    function deletePlayer(team, playerIndex) {
        state.players[team].splice(playerIndex, 1);
        commit("Player deleted.");
    }

    function randomizeMatchups() {
        let shuffled = [...state.teams].sort(() => Math.random() - 0.5);
        state.matchups = [];
        state.selectedMatchup = null;
        for (let index = 0; index < shuffled.length; index += 2) {
            state.matchups.push({home: shuffled[index], away: shuffled[index + 1] || null, homeScore: 0, awayScore: 0, completed: false});
        }
        commit("New matchups created.");
    }

    function chooseMatchup(index) {
        state.selectedMatchup = index;
        commit("Matchup chosen for the field.");
    }

    function updateMatchupScore(index, side, points) {
        let matchup = state.matchups[index];
        let key = side === "home" ? "homeScore" : "awayScore";
        matchup[key] = Math.max(0, (matchup[key] || 0) + points);
        commit();
    }

    function toggleMatchup(index) {
        state.matchups[index].completed = !state.matchups[index].completed;
        commit();
    }

    function deleteMatchup(index) {
        state.matchups.splice(index, 1);
        if (state.selectedMatchup === index) state.selectedMatchup = null;
        else if (state.selectedMatchup > index) state.selectedMatchup -= 1;
        commit("Matchup deleted.");
    }

    function renderItinerary() {
        let list = document.getElementById("itineraryList");
        list.innerHTML = "";
        let entries = [...state.itinerary].sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
        if (entries.length === 0) {
            list.innerHTML = '<p class="empty-state">No itinerary items yet.</p>';
            return;
        }
        entries.forEach(item => {
            let div = document.createElement("div");
            div.className = "itinerary-item itinerary-card";
            div.innerHTML = `<div class="itinerary-date"><span>${escapeHTML(item.day)}</span><span class="itinerary-time">${escapeHTML(item.date)} at ${escapeHTML(item.time)}</span></div><div class="itinerary-details"><strong>${escapeHTML(item.activity)}</strong><p class="itinerary-meta">${escapeHTML(item.location)} - Coach: ${escapeHTML(item.coach)}</p><p class="itinerary-notes">${escapeHTML(item.notes || "No additional notes")}</p></div>`;
            let actions = document.createElement("div");
            actions.className = "itinerary-actions";
            actions.innerHTML = `<button type="button">Edit</button><button type="button" class="danger">Delete</button>`;
            actions.children[0].addEventListener("click", () => editItinerary(item.id));
            actions.children[1].addEventListener("click", () => deleteItinerary(item.id));
            div.appendChild(actions);
            list.appendChild(div);
        });
    }

    function renderTeams() {
        let display = document.getElementById("teamsDisplay");
        let query = document.getElementById("teamSearch").value.trim().toLowerCase();
        display.innerHTML = "";
        let visibleTeams = state.teams.filter(team => team.toLowerCase().includes(query) || (state.players[team] || []).some(player => player.toLowerCase().includes(query)));
        if (visibleTeams.length === 0) {
            display.innerHTML = '<p class="empty-state">No matching teams.</p>';
        }
        visibleTeams.forEach(team => {
            let teamDiv = document.createElement("div");
            teamDiv.className = "team";
            let roster = state.players[team] || [];
            teamDiv.innerHTML = `<div class="team-heading"><h3>${escapeHTML(team)}</h3><strong>${state.scores[team] || 0} points</strong></div><p>Players:</p><ul>${roster.length ? roster.map((player, index) => `<li>${escapeHTML(player)} <button type="button">Delete</button></li>`).join("") : "<li>No players yet.</li>"}</ul>`;
            let playerButtons = teamDiv.querySelectorAll("li button");
            playerButtons.forEach((button, index) => button.addEventListener("click", () => deletePlayer(team, index)));
            let score = document.createElement("p");
            score.className = "score";
            score.textContent = state.scores[team] || 0;
            teamDiv.appendChild(score);
            let actions = document.createElement("div");
            actions.className = "team-actions";
            actions.innerHTML = `<button type="button">+1 Point</button><button type="button">-1 Point</button><button type="button">Rename</button><button type="button" class="danger">Delete Team</button>`;
            actions.children[0].addEventListener("click", () => updateScore(team, 1));
            actions.children[1].addEventListener("click", () => updateScore(team, -1));
            actions.children[2].addEventListener("click", () => renameTeam(team));
            actions.children[3].addEventListener("click", () => deleteTeam(team));
            teamDiv.appendChild(actions);
            display.appendChild(teamDiv);
        });
        let select = document.getElementById("teamSelect");
        select.innerHTML = "";
        state.teams.forEach(team => {
            let option = document.createElement("option");
            option.value = team;
            option.textContent = team;
            select.appendChild(option);
        });
    }

    function renderMatchups() {
        let display = document.getElementById("matchups");
        display.innerHTML = "";
        if (state.matchups.length === 0) {
            display.innerHTML = '<p class="empty-state">No matchups yet. Randomize the teams to create one.</p>';
            return;
        }
        display.innerHTML = "<h2>Matchups</h2>";
        state.matchups.forEach((matchup, index) => {
            let div = document.createElement("div");
            div.className = `itinerary-item${matchup.completed ? " completed" : ""}`;
            let away = matchup.away ? escapeHTML(matchup.away) : "BYE";
            div.innerHTML = `<div class="matchup-heading"><strong>${escapeHTML(matchup.home)} ${matchup.away ? "vs" : "has a"} ${away}</strong><span>${matchup.completed ? "Completed" : "In progress"}</span></div>`;
            if (matchup.away) {
                let score = document.createElement("p");
                score.className = "score";
                score.textContent = `${matchup.homeScore || 0} - ${matchup.awayScore || 0}`;
                div.appendChild(score);
                let actions = document.createElement("div");
                actions.className = "matchup-actions";
                actions.innerHTML = `<button type="button" class="${state.selectedMatchup === index ? "selected" : ""}">${state.selectedMatchup === index ? "Chosen" : "Choose"}</button><button type="button">+ ${escapeHTML(matchup.home)}</button><button type="button">+ ${escapeHTML(matchup.away)}</button><button type="button">${matchup.completed ? "Reopen" : "Complete"}</button><button type="button" class="danger">Delete</button>`;
                actions.children[0].addEventListener("click", () => chooseMatchup(index));
                actions.children[1].addEventListener("click", () => updateMatchupScore(index, "home", 1));
                actions.children[2].addEventListener("click", () => updateMatchupScore(index, "away", 1));
                actions.children[3].addEventListener("click", () => toggleMatchup(index));
                actions.children[4].addEventListener("click", () => deleteMatchup(index));
                div.appendChild(actions);
            } else {
                let actions = document.createElement("div");
                actions.className = "matchup-actions";
                actions.innerHTML = `<button type="button" class="danger">Delete</button>`;
                actions.children[0].addEventListener("click", () => deleteMatchup(index));
                div.appendChild(actions);
            }
            display.appendChild(div);
        });
    }

    function renderField() {
        let summary = document.getElementById("fieldSummary");
        let field = document.getElementById("soccerField");
        let controls = document.getElementById("fieldControls");
        let queue = document.getElementById("fieldQueue");
        let nextIndex = state.matchups.findIndex(matchup => !matchup.completed);
        let selectedIndex = state.selectedMatchup !== null && state.matchups[state.selectedMatchup]
            ? state.selectedMatchup
            : -1;
        let displayIndex = selectedIndex >= 0 ? selectedIndex : (nextIndex >= 0 ? nextIndex : state.matchups.length - 1);

        summary.innerHTML = nextIndex >= 0
            ? `<span>Next up</span><strong>Match ${nextIndex + 1} of ${state.matchups.length}</strong>`
            : "<span>No upcoming matchups</span>";
        field.innerHTML = "";
        controls.innerHTML = "";
        queue.innerHTML = "";

        if (displayIndex < 0) {
            field.innerHTML = '<p class="empty-state">Create a matchup or reopen a completed game to use the field view.</p>';
            return;
        }

        let matchup = state.matchups[displayIndex];
        let homeGoal = document.createElement("div");
        homeGoal.className = "field-goal home";
        homeGoal.setAttribute("aria-hidden", "true");
        field.appendChild(homeGoal);

        let awayGoal = document.createElement("div");
        awayGoal.className = "field-goal away";
        awayGoal.setAttribute("aria-hidden", "true");
        field.appendChild(awayGoal);

        let homeSide = document.createElement("div");
        homeSide.className = "field-side home";
        homeSide.innerHTML = `<span class="field-label">Home side</span><span class="field-team-name">${escapeHTML(matchup.home)}</span><span class="field-score">${matchup.homeScore || 0}</span>`;
        field.appendChild(homeSide);

        let awaySide = document.createElement("div");
        awaySide.className = "field-side away";
        awaySide.innerHTML = matchup.away
            ? `<span class="field-label">Away side</span><span class="field-team-name">${escapeHTML(matchup.away)}</span><span class="field-score">${matchup.awayScore || 0}</span>`
            : '<span class="field-label">Away side</span><span class="field-team-name">BYE</span><span class="field-score">-</span>';
        field.appendChild(awaySide);

        if (matchup.away) {
            controls.innerHTML = `<button type="button">+ ${escapeHTML(matchup.home)}</button><button type="button">+ ${escapeHTML(matchup.away)}</button><button type="button">${matchup.completed ? "Reopen Match" : "Complete Match"}</button>`;
            controls.children[0].addEventListener("click", () => updateMatchupScore(displayIndex, "home", 1));
            controls.children[1].addEventListener("click", () => updateMatchupScore(displayIndex, "away", 1));
            controls.children[2].addEventListener("click", () => toggleMatchup(displayIndex));
        }

        state.matchups.forEach((item, index) => {
            let queueItem = document.createElement("div");
            queueItem.className = `queue-item${index === nextIndex ? " next" : ""}`;
            queueItem.innerHTML = `<span>${index === nextIndex ? "NEXT: " : ""}${escapeHTML(item.home)}${item.away ? ` vs ${escapeHTML(item.away)}` : " (BYE)"}</span><span>${item.homeScore || 0}${item.away ? ` - ${item.awayScore || 0}` : ""}${item.completed ? " | Complete" : ""}</span>`;
            queue.appendChild(queueItem);
        });
    }

    function renderAll() {
        renderItinerary();
        renderTeams();
        renderMatchups();
        renderField();
    }

    document.getElementById("teamSearch").addEventListener("input", renderTeams);
    document.getElementById("randomizeButton").addEventListener("click", randomizeMatchups);
    document.querySelectorAll(".view-tab").forEach(tab => {
        tab.addEventListener("click", () => {
            document.querySelectorAll(".view-tab").forEach(otherTab => {
                let active = otherTab === tab;
                otherTab.classList.toggle("active", active);
                otherTab.setAttribute("aria-selected", active ? "true" : "false");
                document.getElementById(otherTab.dataset.view).hidden = !active;
            });
            if (tab.dataset.view === "fieldView") renderField();
        });
    });
    document.getElementById("clearDataButton").addEventListener("click", () => {
        if (!confirm("Clear all teams, scores, players, itinerary, and matchups?")) return;
        state = {teams: [], scores: {}, players: {}, itinerary: [], matchups: [], selectedMatchup: null};
        localStorage.removeItem(STORAGE_KEY);
        commit("All season data cleared.");
    });
    document.getElementById("exportButton").addEventListener("click", () => {
        let blob = new Blob([JSON.stringify(state, null, 2)], {type: "application/json"});
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "school-soccer-season.json";
        link.click();
        URL.revokeObjectURL(link.href);
        setStatus("Season exported.", false);
    });
    document.getElementById("importInput").addEventListener("change", event => {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = () => {
            try {
                let imported = JSON.parse(reader.result);
                if (!Array.isArray(imported.teams) || !imported.players || !imported.scores) throw new Error();
                state = normalizeState(imported);
                commit("Season imported.");
            } catch (error) {
                setStatus("That file is not a valid season export.");
            }
            event.target.value = "";
        };
        reader.readAsText(file);
    });

    renderAll();
</script>

</body>
</html>
