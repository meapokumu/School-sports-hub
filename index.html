<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Soccer</title>

    <style>
        body {
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: #e8f0eb;
            color: #17332a;
            margin: 0;
            padding: clamp(14px, 4vw, 48px);
        }

        .container {
            max-width: 1080px;
            margin: auto;
            background: white;
            padding: clamp(20px, 4vw, 42px);
            border: 1px solid #d4e2d8;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(20, 60, 43, 0.1);
        }

        h1 {
            margin: 0 0 8px;
            color: #123d2b;
            font-size: clamp(32px, 5vw, 52px);
            letter-spacing: -1px;
        }

        h2 {
            margin: 34px 0 16px;
            color: #1c4d38;
            font-size: clamp(22px, 3vw, 30px);
        }

        h1::after {
            content: "MATCHDAY CONTROL CENTER";
            display: block;
            margin-top: 8px;
            color: #e0733c;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        form {
            display: grid;
            gap: 12px;
        }

        .itinerary-form {
            gap: 18px;
            margin-top: 20px;
            padding: clamp(18px, 3vw, 28px);
            background: #f3f8f4;
            border: 1px solid #dce9df;
            border-radius: 14px;
        }

        .itinerary-form-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        .itinerary-form-header h3,
        .itinerary-form-header p {
            margin: 0;
        }

        .itinerary-form-header h3 {
            color: #164b35;
            font-size: 20px;
        }

        .itinerary-form-header p {
            max-width: 520px;
            color: #5d7467;
            font-size: 14px;
        }

        .itinerary-fields {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 14px;
        }

        .itinerary-field {
            display: grid;
            gap: 6px;
        }

        .itinerary-field label {
            color: #28503d;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.7px;
            text-transform: uppercase;
        }

        .itinerary-field label span {
            color: #789083;
            font-weight: normal;
            letter-spacing: 0;
            text-transform: none;
        }

        .itinerary-field.day,
        .itinerary-field.date,
        .itinerary-field.time {
            grid-column: span 4;
        }

        .itinerary-field.activity,
        .itinerary-field.location,
        .itinerary-field.coach {
            grid-column: span 4;
        }

        .itinerary-field.notes {
            grid-column: 1 / -1;
        }

        .itinerary-form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .itinerary-form-actions button {
            min-width: 180px;
        }

        .itinerary-form-actions button[type="button"] {
            background: transparent;
            color: #164b35;
        }

        input,
        textarea,
        button {
            border: 1px solid #cbdcd0;
            border-radius: 8px;
            padding: 11px 13px;
            font-size: 16px;
        }

        input,
        textarea,
        select {
            background: #fbfdfb;
            color: #17332a;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            background: #164b35;
            color: white;
            border-color: #164b35;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 160ms ease, transform 160ms ease;
        }

        button:hover {
            background: #0e3827;
            transform: translateY(-1px);
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: 3px solid #4d90fe;
            outline-offset: 2px;
        }

        button.danger {
            background: #b42318;
        }

        button.danger:hover {
            background: #8f1c13;
        }

        .empty-state {
            color: #666;
            text-align: center;
            padding: 18px;
            margin-top: 15px;
            border: 1px dashed #bbb;
            border-radius: 8px;
        }

        .status-message {
            min-height: 22px;
            margin: 12px 0 0;
            color: #8f1c13;
            font-weight: bold;
        }

        .season-tools,
        .team-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-top: 16px;
        }

        .season-tools button,
        .team-filter input {
            flex: 1;
            min-width: 160px;
        }

        .season-tools input[type="file"] {
            display: none;
        }

        .season-tools label {
            flex: 1;
            min-width: 160px;
            padding: 10px;
            border-radius: 6px;
            background: #164b35;
            color: white;
            text-align: center;
            cursor: pointer;
        }

        .team-heading,
        .matchup-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .team-heading h3,
        .matchup-heading strong {
            margin: 0;
        }

        .team-actions,
        .matchup-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .team-actions button,
        .matchup-actions button {
            flex: 1;
            min-width: 120px;
        }

        .matchup-actions button.selected {
            background: #16803c;
        }

        .completed {
            opacity: 0.7;
            border-left-color: #16803c;
        }

        .completed .matchup-heading strong {
            text-decoration: line-through;
        }

        .view-tabs {
            display: flex;
            gap: 8px;
            margin: 22px 0;
            border-bottom: 1px solid #ddd;
        }

        .view-tab {
            flex: 1;
            border-radius: 6px 6px 0 0;
            background: #edf4ef;
            color: #28503d;
        }

        .view-tab.active {
            background: #e0733c;
            color: white;
        }

        .view-panel[hidden] {
            display: none;
        }

        .field-summary {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin: 18px 0;
            padding: 14px;
            background: #edf5ef;
            border: 1px solid #d5e5d9;
            border-radius: 8px;
        }

        .field-summary strong {
            font-size: 20px;
        }

        .soccer-field {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            min-height: 430px;
            overflow: hidden;
            border: 5px solid #f9fff9;
            border-radius: 14px;
            background: linear-gradient(90deg, transparent calc(50% - 1px), rgba(255, 255, 255, 0.85) calc(50% - 1px), rgba(255, 255, 255, 0.85) calc(50% + 1px), transparent calc(50% + 1px)), repeating-linear-gradient(90deg, #287a43 0, #287a43 9%, #2f874b 9%, #2f874b 18%);
            box-shadow: inset 0 0 0 2px #1d5c32, 0 12px 24px rgba(20, 60, 43, 0.2);
            color: white;
        }

        .soccer-field::before {
            content: "";
            position: absolute;
            inset: 8% 0;
            border-top: 2px solid rgba(255, 255, 255, 0.8);
            border-bottom: 2px solid rgba(255, 255, 255, 0.8);
            pointer-events: none;
        }

        .soccer-field::after {
            content: "";
            position: absolute;
            width: 110px;
            height: 110px;
            left: 50%;
            top: 50%;
            border: 2px solid rgba(255, 255, 255, 0.85);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .field-goal {
            position: absolute;
            top: 50%;
            z-index: 3;
            width: 48px;
            height: 142px;
            border: 3px solid rgba(255, 255, 255, 0.95);
            background: repeating-linear-gradient(0deg, rgba(255,255,255,0.22) 0 2px, transparent 2px 10px), repeating-linear-gradient(90deg, rgba(255,255,255,0.2) 0 2px, transparent 2px 10px), rgba(15, 67, 37, 0.22);
            transform: translateY(-50%);
            box-shadow: inset 0 0 0 2px rgba(14, 56, 34, 0.35);
            pointer-events: none;
        }

        .field-goal.home {
            left: -3px;
            border-left: 0;
            border-radius: 0 6px 6px 0;
        }

        .field-goal.away {
            right: -3px;
            border-right: 0;
            border-radius: 6px 0 0 6px;
        }

        .field-side {
            position: relative;
            z-index: 1;
            min-width: 0;
            padding: 26px 18px;
            text-align: center;
        }

        .field-side.home {
            border-right: 1px solid rgba(255, 255, 255, 0.45);
        }

        .field-side.away {
            border-left: 1px solid rgba(255, 255, 255, 0.45);
        }

        .field-label {
            display: block;
            margin-bottom: 10px;
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .field-team-name {
            display: block;
            overflow-wrap: anywhere;
            font-size: clamp(20px, 4vw, 34px);
            font-weight: bold;
        }

        .field-score {
            display: block;
            margin-top: 12px;
            font-size: clamp(46px, 9vw, 82px);
            line-height: 1;
            font-weight: bold;
        }

        .field-lineup {
            display: grid;
            gap: 7px;
            margin: 16px auto 0;
            max-width: 220px;
            text-align: left;
        }

        .field-player {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 8px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 5px;
            background: rgba(11, 65, 34, 0.32);
            font-size: 12px;
        }

        .field-player strong {
            overflow-wrap: anywhere;
        }

        .field-player span {
            color: #d9f0dc;
            font-size: 10px;
            text-align: right;
        }

        .field-empty-lineup {
            margin: 16px 0 0;
            color: rgba(255, 255, 255, 0.75);
            font-size: 12px;
        }

        .field-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
        }

        .field-controls button {
            min-width: 120px;
        }

        .field-queue {
            display: grid;
            gap: 8px;
            margin-top: 18px;
        }

        .queue-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px;
            border-radius: 6px;
            background: #f3f8f4;
        }

        .queue-item.next {
            border-left: 4px solid #16803c;
            font-weight: bold;
        }

        .itinerary-item {
            background: #164b35;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            border-left: 5px solid #e0733c;
        }

        .itinerary-card {
            display: grid;
            grid-template-columns: minmax(150px, 0.8fr) 1.6fr auto;
            gap: 18px;
            align-items: start;
            padding: 18px;
        }

        .itinerary-date {
            color: #164b35;
            font-size: 18px;
            font-weight: bold;
        }

        .itinerary-time {
            display: block;
            margin-top: 5px;
            color: #e0733c;
            font-size: 14px;
        }

        .itinerary-details strong {
            display: block;
            margin-bottom: 7px;
            color: #17332a;
            font-size: 19px;
        }

        .itinerary-meta,
        .itinerary-notes {
            margin: 5px 0 0;
            color: #5d7467;
            font-size: 14px;
        }

        .itinerary-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .itinerary-actions button {
            min-width: 20px;
        }

        .team-controls {
            display: grid;
            gap: 12px;
            margin-top: 20px;
            padding: 20px;
            background: #f3f8f4;
            border-radius: 8px;
        }

        .team-controls form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .team-controls input,
        .team-controls select {
            flex: 1;
            min-width: 180px;
        }

        .teams {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .team {
            flex: 1;
            min-width: 260px;
            background: #f6faf7;
            padding: 15px;
            border-radius: 8px;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .team button {
            margin-top: 5px;
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-row span {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .player-position {
            width: 145px;
            min-width: 145px;
            padding: 6px 8px;
            font-size: 13px;
        }

        .player-number {
            width: 58px;
            min-width: 58px;
            padding: 6px 8px;
            font-size: 13px;
        }

        .matchup-actions {
            margin-top: 12px;
        }

        .rotation {
            margin-top: 20px;
        }

        .matchup-builder {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto;
            align-items: end;
            gap: 12px;
            margin-top: 20px;
            padding: 18px;
            background: #f3f8f4;
            border: 1px solid #dce9df;
            border-radius: 12px;
        }

        .matchup-builder-field {
            display: grid;
            gap: 6px;
        }

        .matchup-builder-field label {
            color: #28503d;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.7px;
            text-transform: uppercase;
        }

        .matchup-versus {
            padding-bottom: 12px;
            color: #e0733c;
            font-weight: bold;
        }

        .matchup-builder button {
            min-width: 150px;
        }

        .feature-panel,
        .standings-panel {
            margin-top: 20px;
            padding: 18px;
            background: #f3f8f4;
            border: 1px solid #dce9df;
            border-radius: 12px;
        }

        .feature-panel h3,
        .standings-panel h3 {
            margin: 0 0 12px;
            color: #164b35;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .feature-grid label,
        .feature-label {
            display: grid;
            gap: 6px;
            color: #28503d;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        .feature-grid .wide {
            grid-column: span 2;
        }

        .feature-actions,
        .event-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .timer-display {
            display: inline-block;
            min-width: 90px;
            color: #e0733c;
            font-size: 26px;
            font-weight: bold;
        }

        .match-event-list,
        .stat-list,
        .attendance-list {
            display: grid;
            gap: 7px;
            margin-top: 12px;
        }

        .match-event,
        .stat-row,
        .attendance-row,
        .standing-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 9px 10px;
            background: white;
            border: 1px solid #dce9df;
            border-radius: 7px;
        }

        .match-event small,
        .stat-row small,
        .attendance-row small {
            color: #5d7467;
        }

        .standing-table {
            display: grid;
            gap: 6px;
        }

        .standing-row strong {
            min-width: 110px;
        }

        .team-identity {
            display: grid;
            grid-template-columns: 1fr 100px 1fr;
            gap: 10px;
            align-items: end;
            margin-top: 14px;
        }

        .team-identity label,
        .lineup-controls label {
            display: grid;
            gap: 6px;
            color: #28503d;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .team-color {
            width: 100%;
            min-height: 48px;
            padding: 4px;
        }

        .team-badge {
            display: inline-grid;
            width: 34px;
            height: 34px;
            place-items: center;
            margin-right: 6px;
            border-radius: 50%;
            color: white;
            font-size: 12px;
            font-weight: bold;
            vertical-align: middle;
        }

        .lineup-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .lineup-status {
            margin: 8px 0 0;
            color: #5d7467;
            font-size: 13px;
        }

        .print-only {
            display: none;
        }

        body.dark-mode {
            background: #14231c;
            color: #e7f2e9;
        }

        body.dark-mode .container,
        body.dark-mode input,
        body.dark-mode textarea,
        body.dark-mode select,
        body.dark-mode .match-event,
        body.dark-mode .stat-row,
        body.dark-mode .attendance-row,
        body.dark-mode .standing-row {
            background: #20342a;
            color: #e7f2e9;
        }

        body.dark-mode .feature-panel,
        body.dark-mode .standings-panel,
        body.dark-mode .team,
        body.dark-mode .team-controls,
        body.dark-mode .itinerary-form {
            background: #1b2d24;
            border-color: #385442;
        }

        body.dark-mode h1,
        body.dark-mode h2,
        body.dark-mode h3,
        body.dark-mode .feature-grid label,
        body.dark-mode .feature-label,
        body.dark-mode .team-identity label,
        body.dark-mode .lineup-controls label {
            color: #bde3c5;
        }

        @media print {
            body {
                padding: 0;
                background: white;
            }

            .container {
                max-width: none;
                border: 0;
                box-shadow: none;
            }

            .season-tools,
            .view-tabs,
            .team-controls,
            .team-filter,
            .matchup-builder,
            .rotation,
            .team-actions,
            .matchup-actions,
            .field-controls,
            .feature-actions,
            .event-actions,
            .itinerary-form,
            button,
            select,
            input {
                display: none !important;
            }

            .print-only {
                display: block;
            }
        }

        /* =============================
           MOBILE-ONLY FRIENDLY LAYOUT
           ============================= */
        * {
            box-sizing: border-box;
        }

        html {
            font-size: 15px;
        }

        @media (max-width: 700px) {
            body {
                padding: 8px;
                font-size: 15px;
                -webkit-text-size-adjust: 100%;
            }

            .container {
                width: 100%;
                max-width: none;
                padding: 14px;
                border-radius: 10px;
            }

            h1 {
                font-size: 28px;
                margin: 8px 0 18px;
            }

            h2 {
                font-size: 22px;
                margin-top: 22px;
            }

            h3 {
                font-size: 18px;
            }

            form,
            .team-controls form {
                display: flex;
                flex-direction: column;
                width: 100%;
                gap: 8px;
            }

            .itinerary-form,
            .team-controls,
            .feature-panel,
            .standings-panel,
            .matchup-builder,
            .team,
            .itinerary-item {
                padding: 12px;
            }

            .itinerary-form {
                display: grid;
                gap: 14px;
            }

            .itinerary-form-header {
                display: block;
            }

            .itinerary-fields {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .itinerary-field {
                min-width: 0;
            }

            .itinerary-field.day,
            .itinerary-field.date,
            .itinerary-field.time,
            .itinerary-field.activity,
            .itinerary-field.location,
            .itinerary-field.coach {
                grid-column: span 1;
                min-width: 0;
            }

            .itinerary-field.notes {
                grid-column: 1 / -1;
            }

            .itinerary-field input,
            .itinerary-field textarea {
                width: 100%;
                max-width: 100%;
                min-width: 0;
                font-size: 14px;
            }

            .itinerary-form-actions,
            .team-actions,
            .matchup-actions,
            .feature-actions,
            .event-actions,
            .itinerary-actions {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }

            .itinerary-actions button,
            .matchup-actions button,
            .team-actions button,
            .feature-actions button,
            .event-actions button,
            .itinerary-form-actions button {
                width: 100%;
                min-width: 0;
            }

            .itinerary-card {
                grid-template-columns: 1fr;
                gap: 12px;
                padding: 14px;
            }

            input,
            textarea,
            select,
            button {
                width: 100%;
                min-height: 44px;
                box-sizing: border-box;
                font-size: 15px;
                padding: 10px 12px;
                margin: 0;
            }

            textarea {
                min-height: 100px;
            }

            button {
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
            }

            .season-tools,
            .team-filter {
                flex-direction: column;
                align-items: stretch;
            }

            .season-tools button,
            .season-tools label,
            .team-filter input {
                width: 100%;
                min-width: 0;
            }

            .teams {
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin-top: 15px;
            }

            .team {
                width: 100%;
                min-width: 0;
            }

            .team ul {
                padding-left: 20px;
                margin-bottom: 12px;
            }

            .player-row {
                align-items: stretch;
                flex-wrap: wrap;
            }

            .player-position {
                flex: 1;
                width: auto;
                min-width: 120px;
                min-height: 40px;
            }

            .player-number {
                width: 68px;
                min-width: 68px;
                min-height: 40px;
            }

            .score {
                font-size: 32px;
                margin: 12px 0;
            }

            .rotation {
                width: 100%;
                margin-top: 15px;
            }

            .matchup-builder {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .matchup-versus {
                padding: 0;
                text-align: center;
            }

            .feature-grid,
            .team-identity,
            .lineup-controls {
                grid-template-columns: 1fr;
            }

            .feature-grid .wide {
                grid-column: auto;
            }

            .standing-row {
                align-items: flex-start;
                flex-direction: column;
            }

            .itinerary-item {
                margin-top: 10px;
                overflow-wrap: anywhere;
            }

            #matchups {
                width: 100%;
            }

            .soccer-field {
                min-height: 330px;
                border-width: 4px;
            }

            .field-goal {
                width: 28px;
                height: 100px;
            }

            .field-team-name {
                font-size: clamp(16px, 6vw, 24px);
            }

            .field-score {
                font-size: clamp(38px, 13vw, 60px);
            }

            .field-lineup {
                max-width: 140px;
                margin-top: 12px;
            }

            .field-player {
                padding: 5px;
                font-size: 10px;
            }

            .field-summary,
            .queue-item {
                align-items: flex-start;
                flex-direction: column;
            }

            input[type="date"],
            input[type="time"] {
                min-height: 46px;
            }
        }

        @media (max-width: 520px) {
            .itinerary-fields {
                grid-template-columns: 1fr;
            }

            .itinerary-field {
                width: 100%;
            }

            .itinerary-field input,
            .itinerary-field textarea {
                font-size: 13px;
                padding: 9px 10px;
            }

            .itinerary-form-actions,
            .team-actions,
            .matchup-actions,
            .itinerary-actions,
            .feature-actions,
            .event-actions {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 12px;
            }

            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 20px;
            }

            .score {
                font-size: 28px;
            }
        }

        .mobile-only-tools {
            display: none;
        }

        @media (max-width: 700px) {
            .mobile-only-tools {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin: 0 0 18px;
                padding: 10px 12px;
                background: #f3f8f4;
                border-radius: 8px;
                font-size: 14px;
                text-align: center;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>School Soccer</h1>

    <section class="season-tools" aria-label="Season tools">
        <button id="exportButton" type="button">Export Season</button>
        <label for="importInput">Import Season</label>
        <input id="importInput" type="file" accept="application/json">
        <button id="themeButton" type="button">Dark Mode</button>
        <button id="clearDataButton" class="danger" type="button">Clear All Data</button>
    </section>
    <p id="statusMessage" class="status-message" role="status" aria-live="polite"></p>

    <section id="dashboardView" class="view-panel">

    <!-- ITINERARY -->
    <h2>Itinerary</h2>

    <form id="itineraryForm" class="itinerary-form">
        <div class="itinerary-form-header">
            <div>
                <h3 id="itineraryFormTitle">Add a matchday event</h3>
                <p>Build the schedule for training, games, travel, and team activities.</p>
            </div>
        </div>

        <div class="itinerary-fields">
            <div class="itinerary-field day">
                <label for="day">Day</label>
                <input type="text" id="day" placeholder="e.g. Saturday" required>
            </div>
            <div class="itinerary-field date">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>
            <div class="itinerary-field time">
                <label for="time">Start time</label>
                <input type="time" id="time" required>
            </div>
            <div class="itinerary-field activity">
                <label for="activity">Activity</label>
                <input type="text" id="activity" placeholder="e.g. Home game" required>
            </div>
            <div class="itinerary-field location">
                <label for="location">Location</label>
                <input type="text" id="location" placeholder="e.g. Main field" required>
            </div>
            <div class="itinerary-field coach">
                <label for="coach">Coach / contact</label>
                <input type="text" id="coach" placeholder="e.g. Coach Taylor" required>
            </div>
            <div class="itinerary-field notes">
                <label for="notes">Notes <span>(optional)</span></label>
                <textarea id="notes" placeholder="Add arrival details, equipment reminders, or other notes"></textarea>
            </div>
        </div>

        <div class="itinerary-form-actions">
            <button id="itinerarySubmit" type="submit">Add Itinerary Item</button>
            <button id="itineraryCancel" type="button" hidden>Cancel Edit</button>
        </div>

    </form>


    <!-- DISPLAY ITINERARY -->
    <h2>School Soccer Itinerary</h2>

    <div id="itineraryList"></div>


    <!-- TEAMS -->
    <h2>Teams</h2>

    <section class="team-controls">
        <form id="teamForm">
            <input type="text" id="teamName" placeholder="Team name" required>
            <input type="text" id="teamPlayers" placeholder="Players separated by commas">
            <button type="submit">Add Team</button>
        </form>

        <form id="playerForm">
            <select id="teamSelect" required></select>
            <input type="text" id="newPlayers" placeholder="Add players separated by commas" required>
            <button type="submit">Add Players</button>
        </form>
    </section>

    <div class="teams" id="teamsDisplay"></div>

    <section class="feature-panel" aria-label="Team lineup setup">
        <h3>Team identity and lineup</h3>
        <div class="feature-grid">
            <label>Team
                <select id="detailTeamSelect"></select>
            </label>
            <label>Formation
                <select id="formationSelect"></select>
            </label>
            <label>Team color
                <input id="teamColorInput" class="team-color" type="color" value="#164b35">
            </label>
            <label class="wide">Badge initials
                <input id="teamBadgeInput" maxlength="3" placeholder="e.g. SCH">
            </label>
        </div>
        <div class="lineup-controls">
            <label>Starting lineup
                <select id="starterSelect" multiple size="4"></select>
            </label>
            <label>Substitutes
                <select id="substituteSelect" multiple size="4"></select>
            </label>
        </div>
        <p id="lineupStatus" class="lineup-status">Select players to create a starting lineup.</p>
        <div class="feature-actions">
            <button id="saveTeamDetailsButton" type="button">Save Team Setup</button>
            <button id="attendanceButton" type="button">Mark Starters Present</button>
        </div>
        <div id="attendanceList" class="attendance-list"></div>
    </section>

    <div class="team-filter">
        <input type="search" id="teamSearch" placeholder="Search teams or players" aria-label="Search teams or players">
    </div>

    <form id="matchupBuilder" class="matchup-builder">
        <div class="matchup-builder-field">
            <label for="homeTeamSelect">Home team</label>
            <select id="homeTeamSelect" required></select>
        </div>
        <span class="matchup-versus" aria-hidden="true">VS</span>
        <div class="matchup-builder-field">
            <label for="awayTeamSelect">Away team</label>
            <select id="awayTeamSelect" required></select>
        </div>
        <button type="submit">Add Matchup</button>
    </form>

    <button class="rotation" id="randomizeButton" type="button">
        Randomize Matchups
    </button>

    <label class="feature-label" style="margin-top: 14px; max-width: 220px;">Show matches
        <select id="matchupFilter">
            <option value="all">All matches</option>
            <option value="upcoming">Upcoming</option>
            <option value="completed">Completed</option>
        </select>
    </label>
    
    <div id="matchups"></div>

    <section class="standings-panel">
        <h3>Team standings</h3>
        <div class="standing-table" id="standingsTable"></div>
    </section>

    </section>

</div>


<script>
    const STORAGE_KEY = "school-soccer-season-v1";
    const PLAYER_POSITIONS = ["Unassigned", "Goalkeeper", "Defender", "Midfielder", "Forward"];
    const FORMATIONS = ["4-3-3", "4-4-2", "3-5-2", "3-4-3", "5-3-2"];
    const EVENT_TYPES = ["Goal", "Assist", "Substitution", "Yellow card", "Red card"];
    let editingItineraryId = null;
    let timerInterval = null;
    let previousState = null;
    let state = loadState();

    function defaultState() {
        return {
            teams: ["Team A", "Team B"],
            scores: {"Team A": 0, "Team B": 0},
            players: {
                "Team A": ["Player 1", "Player 2", "Player 3"],
                "Team B": ["Player 4", "Player 5", "Player 6"]
            },
            positions: {
                "Team A": {"Player 1": "Unassigned", "Player 2": "Unassigned", "Player 3": "Unassigned"},
                "Team B": {"Player 4": "Unassigned", "Player 5": "Unassigned", "Player 6": "Unassigned"}
            },
            jerseys: {
                "Team A": {"Player 1": 1, "Player 2": 2, "Player 3": 3},
                "Team B": {"Player 4": 4, "Player 5": 5, "Player 6": 6}
            },
            teamDetails: {
                "Team A": {formation: "4-3-3", color: "#164b35", badge: "A", starters: [], substitutes: [], attendance: {}},
                "Team B": {formation: "4-3-3", color: "#e0733c", badge: "B", starters: [], substitutes: [], attendance: {}}
            },
            playerStats: {},
            theme: "light",
            itinerary: [],
            matchups: [],
            selectedMatchup: null
        };
    }

    function loadState() {
        try {
            let saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
            return normalizeState(saved || defaultState());
        } catch (error) {
            return defaultState();
        }
    }

    function normalizeState(value) {
        let fallback = defaultState();
        if (!value || !Array.isArray(value.teams)) {
            return fallback;
        }

        let teams = value.teams.filter(team => typeof team === "string" && team.trim());
        let scores = {};
        let players = {};
        let positions = {};
        let jerseys = {};
        let teamDetails = {};
        let playerStats = {};
        teams.forEach(team => {
            scores[team] = Number.isFinite(Number(value.scores?.[team])) ? Math.max(0, Number(value.scores[team])) : 0;
            players[team] = Array.isArray(value.players?.[team])
                ? value.players[team].filter(player => typeof player === "string" && player.trim())
                : [];
            positions[team] = {};
            jerseys[team] = {};
            players[team].forEach(player => {
                let position = value.positions?.[team]?.[player];
                positions[team][player] = PLAYER_POSITIONS.includes(position) ? position : "Unassigned";
                jerseys[team][player] = Math.max(0, Number(value.jerseys?.[team]?.[player]) || 0);
                let savedStats = value.playerStats?.[team]?.[player] || {};
                playerStats[team] = playerStats[team] || {};
                playerStats[team][player] = {
                    games: Math.max(0, Number(savedStats.games) || 0),
                    goals: Math.max(0, Number(savedStats.goals) || 0),
                    assists: Math.max(0, Number(savedStats.assists) || 0),
                    minutes: Math.max(0, Number(savedStats.minutes) || 0)
                };
            });
            let savedDetails = value.teamDetails?.[team] || {};
            teamDetails[team] = {
                formation: FORMATIONS.includes(savedDetails.formation) ? savedDetails.formation : "4-3-3",
                color: /^#[0-9a-f]{6}$/i.test(savedDetails.color || "") ? savedDetails.color : "#164b35",
                badge: String(savedDetails.badge || team.slice(0, 1)).slice(0, 3).toUpperCase(),
                starters: players[team].filter(player => Array.isArray(savedDetails.starters) && savedDetails.starters.includes(player)),
                substitutes: players[team].filter(player => Array.isArray(savedDetails.substitutes) && savedDetails.substitutes.includes(player)),
                attendance: savedDetails.attendance && typeof savedDetails.attendance === "object" ? savedDetails.attendance : {}
            };
        });

        return {
            teams,
            scores,
            players,
            positions,
            jerseys,
            teamDetails,
            playerStats,
            theme: value.theme === "dark" ? "dark" : "light",
            itinerary: Array.isArray(value.itinerary) ? value.itinerary.map(item => ({
                id: item.id || `${Date.now()}-${Math.random()}`,
                day: item.day || "",
                date: item.date || "",
                time: item.time || "",
                activity: item.activity || "",
                location: item.location || "",
                coach: item.coach || "",
                notes: item.notes || ""
            })) : [],
            matchups: Array.isArray(value.matchups) ? value.matchups
                .filter(matchup => matchup && teams.includes(matchup.home))
                .map(matchup => ({
                    home: matchup.home,
                    away: matchup.away && teams.includes(matchup.away) ? matchup.away : null,
                    homeScore: Math.max(0, Number(matchup.homeScore) || 0),
                    awayScore: Math.max(0, Number(matchup.awayScore) || 0),
                    completed: Boolean(matchup.completed),
                    timerSeconds: Math.max(0, Number(matchup.timerSeconds) || 0),
                    events: Array.isArray(matchup.events) ? matchup.events.map(event => ({
                        type: EVENT_TYPES.includes(event.type) ? event.type : "Goal",
                        team: teams.includes(event.team) ? event.team : matchup.home,
                        player: String(event.player || "Team event"),
                        minute: Math.max(0, Number(event.minute) || 0)
                    })) : []
                })) : [],
            selectedMatchup: Number.isInteger(value.selectedMatchup) && value.selectedMatchup >= 0 && value.selectedMatchup < (value.matchups || []).length
                ? value.selectedMatchup
                : null
        };
    }

    function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function setStatus(message, isError = true) {
        let status = document.getElementById("statusMessage");
        status.textContent = message;
        status.style.color = isError ? "#8f1c13" : "#16803c";
        if (message) {
            window.setTimeout(() => {
                if (status.textContent === message) status.textContent = "";
            }, 3500);
        }
    }

    function normalizeNames(input) {
        return input.split(",").map(name => name.trim()).filter(Boolean);
    }

    function hasName(list, name) {
        return list.some(item => item.toLowerCase() === name.toLowerCase());
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>'"]/g, character => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
        }[character]));
    }

    function cloneState(value = state) {
        return JSON.parse(JSON.stringify(value));
    }

    function rememberState() {
        previousState = cloneState();
    }

    function selectedMatchup() {
        return state.selectedMatchup !== null && state.matchups[state.selectedMatchup]
            ? state.matchups[state.selectedMatchup]
            : null;
    }

    function formatTimer(seconds) {
        let minutes = Math.floor(seconds / 60).toString().padStart(2, "0");
        let remaining = (seconds % 60).toString().padStart(2, "0");
        return `${minutes}:${remaining}`;
    }

    function setTimerDisplay() {
        let matchup = selectedMatchup();
        let timerDisplay = document.getElementById("timerDisplay");
        if (timerDisplay) {
            timerDisplay.textContent = formatTimer(matchup?.timerSeconds || 0);
        }
    }

    function ensureTeamFeatureData(team) {
        state.teamDetails = state.teamDetails || {};
        state.playerStats = state.playerStats || {};
        state.jerseys = state.jerseys || {};
        state.teamDetails[team] = state.teamDetails[team] || {formation: "4-3-3", color: "#164b35", badge: team.slice(0, 1).toUpperCase(), starters: [], substitutes: [], attendance: {}};
        state.playerStats[team] = state.playerStats[team] || {};
        state.jerseys[team] = state.jerseys[team] || {};
        (state.players[team] || []).forEach(player => {
            state.playerStats[team][player] = state.playerStats[team][player] || {games: 0, goals: 0, assists: 0, minutes: 0};
            state.jerseys[team][player] = state.jerseys[team][player] || 0;
        });
    }

    function commit(message) {
        saveState();
        renderAll();
        setTimerDisplay();
        if (message) setStatus(message, false);
    }

    function undoLastAction() {
        if (!previousState) {
            setStatus("There is no action to undo yet.");
            return;
        }
        state = previousState;
        previousState = null;
        commit("Last action undone.");
    }

    document.getElementById("teamForm").addEventListener("submit", event => {
        event.preventDefault();
        rememberState();
        let name = document.getElementById("teamName").value.trim();
        let newPlayers = normalizeNames(document.getElementById("teamPlayers").value);
        if (hasName(state.teams, name)) {
            setStatus("That team name already exists.");
            return;
        }
        state.teams.push(name);
        state.scores[name] = 0;
        state.players[name] = newPlayers;
        state.positions = state.positions || {};
        state.positions[name] = {};
        state.jerseys = state.jerseys || {};
        state.jerseys[name] = {};
        state.teamDetails[name] = {formation: "4-3-3", color: "#164b35", badge: name.slice(0, 3).toUpperCase(), starters: [], substitutes: [], attendance: {}};
        state.playerStats[name] = {};
        newPlayers.forEach(player => state.positions[name][player] = "Unassigned");
        newPlayers.forEach((player, index) => state.jerseys[name][player] = index + 1);
        newPlayers.forEach(player => state.playerStats[name][player] = {games: 0, goals: 0, assists: 0, minutes: 0});
        event.target.reset();
        commit(`${name} added.`);
    });

    document.getElementById("playerForm").addEventListener("submit", event => {
        event.preventDefault();
        rememberState();
        let team = document.getElementById("teamSelect").value;
        let additions = normalizeNames(document.getElementById("newPlayers").value);
        let existing = state.players[team] || [];
        let unique = additions.filter(player => !hasName(existing, player));
        if (!team || unique.length === 0) {
            setStatus("Choose a team and enter at least one new player.");
            return;
        }
        state.players[team] = existing.concat(unique);
        state.positions = state.positions || {};
        state.positions[team] = state.positions[team] || {};
        state.jerseys = state.jerseys || {};
        state.jerseys[team] = state.jerseys[team] || {};
        unique.forEach(player => state.positions[team][player] = "Unassigned");
        unique.forEach(player => state.jerseys[team][player] = 0);
        unique.forEach(player => state.playerStats[team][player] = {games: 0, goals: 0, assists: 0, minutes: 0});
        event.target.reset();
        commit("Players added.");
    });

    document.getElementById("itineraryForm").addEventListener("submit", event => {
        event.preventDefault();
        rememberState();
        let item = {
            id: editingItineraryId || Date.now().toString(),
            day: document.getElementById("day").value.trim(),
            date: document.getElementById("date").value,
            time: document.getElementById("time").value,
            activity: document.getElementById("activity").value.trim(),
            location: document.getElementById("location").value.trim(),
            coach: document.getElementById("coach").value.trim(),
            notes: document.getElementById("notes").value.trim()
        };
        let existingIndex = state.itinerary.findIndex(entry => entry.id === editingItineraryId);
        if (existingIndex >= 0) state.itinerary[existingIndex] = item;
        else state.itinerary.push(item);
        resetItineraryForm();
        commit(existingIndex >= 0 ? "Itinerary item updated." : "Itinerary item added.");
    });

    document.getElementById("itineraryCancel").addEventListener("click", resetItineraryForm);

    function resetItineraryForm() {
        editingItineraryId = null;
        document.getElementById("itineraryForm").reset();
        document.getElementById("itinerarySubmit").textContent = "Add Itinerary Item";
        document.getElementById("itineraryFormTitle").textContent = "Add a matchday event";
        document.getElementById("itineraryCancel").hidden = true;
    }

    function editItinerary(id) {
        let item = state.itinerary.find(entry => entry.id === id);
        if (!item) return;
        editingItineraryId = id;
        Object.keys(item).forEach(key => {
            let field = document.getElementById(key);
            if (field) field.value = item[key] || "";
        });
        document.getElementById("itinerarySubmit").textContent = "Save Itinerary Changes";
        document.getElementById("itineraryFormTitle").textContent = "Edit matchday event";
        document.getElementById("itineraryCancel").hidden = false;
        document.getElementById("day").focus();
    }

    function deleteItinerary(id) {
        if (!confirm("Delete this itinerary item?")) return;
        state.itinerary = state.itinerary.filter(item => item.id !== id);
        commit("Itinerary item deleted.");
    }

    function updateScore(team, points) {
        rememberState();
        state.scores[team] = Math.max(0, (state.scores[team] || 0) + points);
        commit();
    }

    function renameTeam(team) {
        let newName = prompt("New team name:", team)?.trim();
        if (!newName || newName === team) return;
        if (hasName(state.teams.filter(item => item !== team), newName)) {
            setStatus("That team name already exists.");
            return;
        }
        rememberState();
        let index = state.teams.indexOf(team);
        state.teams[index] = newName;
        state.scores[newName] = state.scores[team] || 0;
        state.players[newName] = state.players[team] || [];
        state.positions = state.positions || {};
        state.positions[newName] = state.positions[team] || {};
        state.jerseys = state.jerseys || {};
        state.jerseys[newName] = state.jerseys[team] || {};
        state.teamDetails[newName] = state.teamDetails[team] || {};
        state.playerStats[newName] = state.playerStats[team] || {};
        delete state.scores[team];
        delete state.players[team];
        delete state.positions?.[team];
        delete state.jerseys?.[team];
        delete state.teamDetails?.[team];
        delete state.playerStats?.[team];
        state.matchups.forEach(matchup => {
            if (matchup.home === team) matchup.home = newName;
            if (matchup.away === team) matchup.away = newName;
        });
        commit(`${newName} renamed.`);
    }

    function deleteTeam(team) {
        if (!confirm(`Delete ${team} and all of its players?`)) return;
        rememberState();
        state.teams = state.teams.filter(item => item !== team);
        delete state.scores[team];
        delete state.players[team];
        delete state.positions?.[team];
        delete state.jerseys?.[team];
        delete state.teamDetails?.[team];
        delete state.playerStats?.[team];
        state.matchups = state.matchups.filter(matchup => matchup.home !== team && matchup.away !== team);
        commit(`${team} deleted.`);
    }

    function deletePlayer(team, playerIndex) {
        rememberState();
        let player = state.players[team][playerIndex];
        state.players[team].splice(playerIndex, 1);
        delete state.positions?.[team]?.[player];
        delete state.jerseys?.[team]?.[player];
        delete state.playerStats?.[team]?.[player];
        state.teamDetails[team].starters = state.teamDetails[team].starters.filter(item => item !== player);
        state.teamDetails[team].substitutes = state.teamDetails[team].substitutes.filter(item => item !== player);
        commit("Player deleted.");
    }

    function updatePlayerPosition(team, player, position) {
        rememberState();
        state.positions[team] = state.positions[team] || {};
        state.positions[team][player] = PLAYER_POSITIONS.includes(position) ? position : "Unassigned";
        commit(`${player} position updated.`);
    }

    function updateJerseyNumber(team, player, number) {
        rememberState();
        state.jerseys[team] = state.jerseys[team] || {};
        state.jerseys[team][player] = Math.max(0, Math.min(99, Number(number) || 0));
        commit(`${player} number updated.`);
    }

    function randomizeMatchups() {
        rememberState();
        let shuffled = [...state.teams].sort(() => Math.random() - 0.5);
        state.matchups = [];
        state.selectedMatchup = null;
        for (let index = 0; index < shuffled.length; index += 2) {
            state.matchups.push({home: shuffled[index], away: shuffled[index + 1] || null, homeScore: 0, awayScore: 0, completed: false, timerSeconds: 0, events: []});
        }
        commit("New matchups created.");
    }

    function chooseMatchup(index) {
        rememberState();
        state.selectedMatchup = index;
        commit("Matchup chosen for the field.");
    }

    function updateMatchupScore(index, side, points) {
        rememberState();
        let matchup = state.matchups[index];
        let key = side === "home" ? "homeScore" : "awayScore";
        matchup[key] = Math.max(0, (matchup[key] || 0) + points);
        commit();
    }

    function toggleMatchup(index) {
        rememberState();
        let matchup = state.matchups[index];
        matchup.completed = !matchup.completed;
        [matchup.home, matchup.away].filter(Boolean).forEach(team => {
            ensureTeamFeatureData(team);
            (state.teamDetails[team].starters || []).forEach(player => {
                state.playerStats[team][player].games = Math.max(0, state.playerStats[team][player].games + (matchup.completed ? 1 : -1));
                state.playerStats[team][player].minutes = Math.max(0, state.playerStats[team][player].minutes + (matchup.completed ? Math.floor((matchup.timerSeconds || 0) / 60) : -Math.floor((matchup.timerSeconds || 0) / 60)));
            });
        });
        commit();
    }

    function deleteMatchup(index) {
        rememberState();
        state.matchups.splice(index, 1);
        if (state.selectedMatchup === index) state.selectedMatchup = null;
        else if (state.selectedMatchup > index) state.selectedMatchup -= 1;
        commit("Matchup deleted.");
    }

    function renderItinerary() {
        let list = document.getElementById("itineraryList");
        list.innerHTML = "";
        let entries = [...state.itinerary].sort((a, b) => `${a.date} ${a.time}`.localeCompare(`${b.date} ${b.time}`));
        if (entries.length === 0) {
            list.innerHTML = '<p class="empty-state">No itinerary items yet.</p>';
            return;
        }
        entries.forEach(item => {
            let div = document.createElement("div");
            div.className = "itinerary-item itinerary-card";
            div.innerHTML = `<div class="itinerary-date"><span>${escapeHTML(item.day)}</span><span class="itinerary-time">${escapeHTML(item.date)} at ${escapeHTML(item.time)}</span></div><div class="itinerary-details"><strong>${escapeHTML(item.activity)}</strong><p class="itinerary-meta">${escapeHTML(item.location)} - Coach: ${escapeHTML(item.coach)}</p><p class="itinerary-notes">${escapeHTML(item.notes || "No additional notes")}</p></div>`;
            let actions = document.createElement("div");
            actions.className = "itinerary-actions";
            actions.innerHTML = `<button type="button">Edit</button><button type="button" class="danger">Delete</button>`;
            actions.children[0].addEventListener("click", () => editItinerary(item.id));
            actions.children[1].addEventListener("click", () => deleteItinerary(item.id));
            div.appendChild(actions);
            list.appendChild(div);
        });
    }

    function renderTeamFeaturePanel() {
        let teamSelect = document.getElementById("detailTeamSelect");
        let currentTeam = teamSelect.value && state.teams.includes(teamSelect.value) ? teamSelect.value : state.teams[0];
        teamSelect.innerHTML = state.teams.map(team => `<option value="${escapeHTML(team)}">${escapeHTML(team)}</option>`).join("");
        if (!currentTeam) {
            document.getElementById("lineupStatus").textContent = "Add a team to configure its lineup.";
            return;
        }
        teamSelect.value = currentTeam;
        ensureTeamFeatureData(currentTeam);
        let details = state.teamDetails[currentTeam];
        document.getElementById("formationSelect").innerHTML = FORMATIONS.map(formation => `<option value="${formation}"${formation === details.formation ? " selected" : ""}>${formation}</option>`).join("");
        document.getElementById("teamColorInput").value = details.color;
        document.getElementById("teamBadgeInput").value = details.badge;
        let roster = state.players[currentTeam] || [];
        ["starterSelect", "substituteSelect"].forEach(selectId => {
            let select = document.getElementById(selectId);
            let selected = selectId === "starterSelect" ? details.starters : details.substitutes;
            select.innerHTML = roster.map(player => `<option value="${escapeHTML(player)}"${selected.includes(player) ? " selected" : ""}>${escapeHTML(player)}</option>`).join("");
        });
        document.getElementById("lineupStatus").textContent = `${details.formation} formation - ${details.starters.length} starters, ${details.substitutes.length} substitutes.`;
        renderAttendance(currentTeam);
    }

    function renderAttendance(team) {
        let list = document.getElementById("attendanceList");
        let roster = state.players[team] || [];
        let attendance = state.teamDetails[team]?.attendance || {};
        list.innerHTML = roster.length ? roster.map(player => `<div class="attendance-row"><span>${escapeHTML(player)}</span><small>${attendance[player] ? "Present" : "Not marked"}</small></div>`).join("") : "";
    }

    function saveTeamDetails() {
        let team = document.getElementById("detailTeamSelect").value;
        if (!team) return;
        rememberState();
        ensureTeamFeatureData(team);
        let details = state.teamDetails[team];
        details.formation = document.getElementById("formationSelect").value;
        details.color = document.getElementById("teamColorInput").value;
        details.badge = document.getElementById("teamBadgeInput").value.trim().slice(0, 3).toUpperCase() || team.slice(0, 1).toUpperCase();
        details.starters = [...document.getElementById("starterSelect").selectedOptions].map(option => option.value);
        details.substitutes = [...document.getElementById("substituteSelect").selectedOptions].map(option => option.value).filter(player => !details.starters.includes(player));
        commit(`${team} setup saved.`);
    }

    function markStartersPresent() {
        let team = document.getElementById("detailTeamSelect").value;
        if (!team) return;
        rememberState();
        ensureTeamFeatureData(team);
        state.teamDetails[team].starters.forEach(player => state.teamDetails[team].attendance[player] = true);
        commit(`${team} starters marked present.`);
    }

    function renderStandings() {
        let table = document.getElementById("standingsTable");
        let rows = state.teams.map(team => {
            let played = 0;
            let wins = 0;
            let draws = 0;
            let losses = 0;
            let goalsFor = 0;
            let goalsAgainst = 0;
            state.matchups.filter(matchup => matchup.completed && matchup.away && (matchup.home === team || matchup.away === team)).forEach(matchup => {
                played += 1;
                let teamScore = matchup.home === team ? matchup.homeScore : matchup.awayScore;
                let opponentScore = matchup.home === team ? matchup.awayScore : matchup.homeScore;
                goalsFor += teamScore;
                goalsAgainst += opponentScore;
                if (teamScore > opponentScore) wins += 1;
                else if (teamScore === opponentScore) draws += 1;
                else losses += 1;
            });
            return {team, played, wins, draws, losses, goalsFor, goalsAgainst, points: wins * 3 + draws};
        }).sort((first, second) => second.points - first.points || (second.goalsFor - second.goalsAgainst) - (first.goalsFor - first.goalsAgainst));
        table.innerHTML = rows.length ? rows.map(row => `<div class="standing-row"><strong>${escapeHTML(row.team)}</strong><span>P ${row.played}</span><span>W ${row.wins}</span><span>D ${row.draws}</span><span>L ${row.losses}</span><span>GD ${row.goalsFor - row.goalsAgainst}</span><strong>${row.points} pts</strong></div>`).join("") : '<p class="empty-state">Add teams to build standings.</p>';
    }

    function renderTeams() {
        let display = document.getElementById("teamsDisplay");
        let query = document.getElementById("teamSearch").value.trim().toLowerCase();
        display.innerHTML = "";
        let visibleTeams = state.teams.filter(team => team.toLowerCase().includes(query) || (state.players[team] || []).some(player => player.toLowerCase().includes(query)));
        if (visibleTeams.length === 0) {
            display.innerHTML = '<p class="empty-state">No matching teams.</p>';
        }
        visibleTeams.forEach(team => {
            let teamDiv = document.createElement("div");
            teamDiv.className = "team";
            let roster = state.players[team] || [];
            ensureTeamFeatureData(team);
            let details = state.teamDetails[team];
            let rosterMarkup = roster.length ? roster.map((player, index) => {
                let currentPosition = state.positions[team]?.[player] || "Unassigned";
                let jerseyNumber = state.jerseys[team]?.[player] || 0;
                let positionOptions = PLAYER_POSITIONS.map(position => `<option value="${escapeHTML(position)}"${position === currentPosition ? " selected" : ""}>${escapeHTML(position)}</option>`).join("");
                return `<li><div class="player-row"><span>${escapeHTML(player)}</span><input class="player-number" type="number" min="0" max="99" value="${jerseyNumber || ""}" placeholder="#" data-player-index="${index}" aria-label="Jersey number for ${escapeHTML(player)}"><select class="player-position" data-player-index="${index}" aria-label="Position for ${escapeHTML(player)}">${positionOptions}</select><button type="button">Delete</button></div></li>`;
            }).join("") : "<li>No players yet.</li>";
            teamDiv.innerHTML = `<div class="team-heading"><h3><span class="team-badge" style="background:${escapeHTML(details.color)}">${escapeHTML(details.badge)}</span>${escapeHTML(team)}</h3><strong>${state.scores[team] || 0} points</strong></div><p>${escapeHTML(details.formation)} formation - players and positions:</p><ul>${rosterMarkup}</ul>`;
            let playerButtons = teamDiv.querySelectorAll("li button");
            playerButtons.forEach((button, index) => button.addEventListener("click", () => deletePlayer(team, index)));
            let positionSelects = teamDiv.querySelectorAll(".player-position");
            positionSelects.forEach(select => select.addEventListener("change", () => {
                let playerIndex = Number(select.dataset.playerIndex);
                updatePlayerPosition(team, roster[playerIndex], select.value);
            }));
            let numberInputs = teamDiv.querySelectorAll(".player-number");
            numberInputs.forEach(input => input.addEventListener("change", () => {
                let playerIndex = Number(input.dataset.playerIndex);
                updateJerseyNumber(team, roster[playerIndex], input.value);
            }));
            let score = document.createElement("p");
            score.className = "score";
            score.textContent = state.scores[team] || 0;
            teamDiv.appendChild(score);
            let actions = document.createElement("div");
            actions.className = "team-actions";
            actions.innerHTML = `<button type="button">+1 Point</button><button type="button">-1 Point</button><button type="button">Rename</button><button type="button" class="danger">Delete Team</button>`;
            actions.children[0].addEventListener("click", () => updateScore(team, 1));
            actions.children[1].addEventListener("click", () => updateScore(team, -1));
            actions.children[2].addEventListener("click", () => renameTeam(team));
            actions.children[3].addEventListener("click", () => deleteTeam(team));
            teamDiv.appendChild(actions);
            display.appendChild(teamDiv);
        });
        let select = document.getElementById("teamSelect");
        select.innerHTML = "";
        state.teams.forEach(team => {
            let option = document.createElement("option");
            option.value = team;
            option.textContent = team;
            select.appendChild(option);
        });

        ["homeTeamSelect", "awayTeamSelect"].forEach(selectId => {
            let matchupSelect = document.getElementById(selectId);
            matchupSelect.innerHTML = "";
            state.teams.forEach(team => {
                let option = document.createElement("option");
                option.value = team;
                option.textContent = team;
                matchupSelect.appendChild(option);
            });
        });
    }

    function renderMatchups() {
        let display = document.getElementById("matchups");
        let filter = document.getElementById("matchupFilter").value;
        display.innerHTML = "";
        let visibleMatchups = state.matchups.filter(matchup => filter === "all" || (filter === "completed" ? matchup.completed : !matchup.completed));
        if (visibleMatchups.length === 0) {
            display.innerHTML = '<p class="empty-state">No matchups yet. Choose two teams above or randomize the teams to create games.</p>';
            return;
        }
        display.innerHTML = "<h2>Matchups</h2>";
        visibleMatchups.forEach(matchup => {
            let index = state.matchups.indexOf(matchup);
            let div = document.createElement("div");
            div.className = `itinerary-item${matchup.completed ? " completed" : ""}`;
            let away = matchup.away ? escapeHTML(matchup.away) : "BYE";
            div.innerHTML = `<div class="matchup-heading"><strong>${escapeHTML(matchup.home)} ${matchup.away ? "vs" : "has a"} ${away}</strong><span>${matchup.completed ? "Completed" : "In progress"}</span></div>`;
            if (matchup.away) {
                let score = document.createElement("p");
                score.className = "score";
                score.textContent = `${matchup.homeScore || 0} - ${matchup.awayScore || 0}`;
                div.appendChild(score);
                let actions = document.createElement("div");
                actions.className = "matchup-actions";
                actions.innerHTML = `<button type="button" class="${state.selectedMatchup === index ? "selected" : ""}">${state.selectedMatchup === index ? "Chosen" : "Choose"}</button><button type="button">- ${escapeHTML(matchup.home)}</button><button type="button">+ ${escapeHTML(matchup.home)}</button><button type="button">- ${escapeHTML(matchup.away)}</button><button type="button">+ ${escapeHTML(matchup.away)}</button><button type="button">${matchup.completed ? "Reopen" : "Complete"}</button><button type="button" class="danger">Delete</button>`;
                actions.children[0].addEventListener("click", () => chooseMatchup(index));
                actions.children[1].addEventListener("click", () => updateMatchupScore(index, "home", -1));
                actions.children[2].addEventListener("click", () => updateMatchupScore(index, "home", 1));
                actions.children[3].addEventListener("click", () => updateMatchupScore(index, "away", -1));
                actions.children[4].addEventListener("click", () => updateMatchupScore(index, "away", 1));
                actions.children[5].addEventListener("click", () => toggleMatchup(index));
                actions.children[6].addEventListener("click", () => deleteMatchup(index));
                div.appendChild(actions);
            } else {
                let actions = document.createElement("div");
                actions.className = "matchup-actions";
                actions.innerHTML = `<button type="button" class="danger">Delete</button>`;
                actions.children[0].addEventListener("click", () => deleteMatchup(index));
                div.appendChild(actions);
            }
            display.appendChild(div);
        });
    }

    function renderFieldLineup(team) {
        let roster = state.players[team] || [];
        if (roster.length === 0) return '<p class="field-empty-lineup">No players assigned</p>';
        let details = state.teamDetails[team] || {starters: [], substitutes: [], formation: "4-3-3"};
        let positionOrder = new Map(PLAYER_POSITIONS.map((position, index) => [position, index]));
        let lineup = [...roster].sort((first, second) => {
            let firstPosition = state.positions[team]?.[first] || "Unassigned";
            let secondPosition = state.positions[team]?.[second] || "Unassigned";
            return (positionOrder.get(firstPosition) - positionOrder.get(secondPosition)) || first.localeCompare(second);
        });
        let starters = lineup.filter(player => details.starters.includes(player));
        let substitutes = lineup.filter(player => details.substitutes.includes(player) || !details.starters.includes(player));
        let playerMarkup = (players, label) => players.length ? `<small>${label}</small>${players.map(player => {
            let position = state.positions[team]?.[player] || "Unassigned";
            let number = state.jerseys[team]?.[player] || "-";
            return `<div class="field-player"><strong>#${escapeHTML(number)} ${escapeHTML(player)}</strong><span>${escapeHTML(position)}</span></div>`;
        }).join("")}` : "";
        return `<div class="field-lineup">${playerMarkup(starters, "STARTERS")}${playerMarkup(substitutes, "SUBSTITUTES")}</div>`;
    }

    function renderAll() {
        renderItinerary();
        renderTeams();
        renderTeamFeaturePanel();
        renderMatchups();
        renderStandings();
    }

    document.getElementById("teamSearch").addEventListener("input", renderTeams);
    document.getElementById("matchupFilter").addEventListener("change", renderMatchups);
    document.getElementById("detailTeamSelect").addEventListener("change", renderTeamFeaturePanel);
    document.getElementById("saveTeamDetailsButton").addEventListener("click", saveTeamDetails);
    document.getElementById("attendanceButton").addEventListener("click", markStartersPresent);
    document.getElementById("themeButton").addEventListener("click", () => {
        state.theme = state.theme === "dark" ? "light" : "dark";
        document.body.classList.toggle("dark-mode", state.theme === "dark");
        document.getElementById("themeButton").textContent = state.theme === "dark" ? "Light Mode" : "Dark Mode";
        saveState();
    });
    document.getElementById("randomizeButton").addEventListener("click", randomizeMatchups);
    document.getElementById("matchupBuilder").addEventListener("submit", event => {
        event.preventDefault();
        let home = document.getElementById("homeTeamSelect").value;
        let away = document.getElementById("awayTeamSelect").value;
        if (!home || !away) {
            setStatus("Add at least two teams before creating a matchup.");
            return;
        }
        if (home === away) {
            setStatus("Choose two different teams for a matchup.");
            return;
        }
        rememberState();
        state.matchups.push({home, away, homeScore: 0, awayScore: 0, completed: false, timerSeconds: 0, events: []});
        state.selectedMatchup = state.matchups.length - 1;
        commit(`${home} vs ${away} added.`);
    });
    document.getElementById("clearDataButton").addEventListener("click", () => {
        if (!confirm("Clear all teams, scores, players, itinerary, and matchups?")) return;
        rememberState();
        state = {teams: [], scores: {}, players: {}, positions: {}, teamDetails: {}, playerStats: {}, theme: "light", itinerary: [], matchups: [], selectedMatchup: null};
        localStorage.removeItem(STORAGE_KEY);
        commit("All season data cleared.");
    });
    document.getElementById("exportButton").addEventListener("click", () => {
        let blob = new Blob([JSON.stringify(state, null, 2)], {type: "application/json"});
        let link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "school-soccer-season.json";
        link.click();
        URL.revokeObjectURL(link.href);
        setStatus("Season exported.", false);
    });
    document.getElementById("importInput").addEventListener("change", event => {
        let file = event.target.files[0];
        if (!file) return;
        let reader = new FileReader();
        reader.onload = () => {
            try {
                let imported = JSON.parse(reader.result);
                if (!Array.isArray(imported.teams) || !imported.players || !imported.scores) throw new Error();
                state = normalizeState(imported);
                commit("Season imported.");
            } catch (error) {
                setStatus("That file is not a valid season export.");
            }
            event.target.value = "";
        };
        reader.readAsText(file);
    });

    document.body.classList.toggle("dark-mode", state.theme === "dark");
    document.getElementById("themeButton").textContent = state.theme === "dark" ? "Light Mode" : "Dark Mode";
    renderAll();
</script>

</body>
</html>
