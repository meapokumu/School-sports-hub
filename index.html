<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>School Soccer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            text-align: center;
        }

        form {
            display: grid;
            gap: 12px;
        }

        input,
        textarea,
        button {
            padding: 10px;
            font-size: 16px;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .itinerary-item {
            background: #f7f7f7;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
            border-left: 5px solid #222;
        }

        .team-controls {
            display: grid;
            gap: 12px;
            margin-top: 20px;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 8px;
        }

        .team-controls form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .team-controls input,
        .team-controls select {
            flex: 1;
            min-width: 180px;
        }

        .teams {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .team {
            flex: 1;
            min-width: 260px;
            background: #f7f7f7;
            padding: 15px;
            border-radius: 8px;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
        }

        .team button {
            margin-top: 5px;
        }

        .rotation {
            margin-top: 20px;
        }

        /* =============================
           MOBILE-ONLY FRIENDLY LAYOUT
           ============================= */
        @media (max-width: 700px) {
            body {
                padding: 10px;
                font-size: 16px;
                -webkit-text-size-adjust: 100%;
            }

            .container {
                width: 100%;
                max-width: none;
                box-sizing: border-box;
                padding: 16px;
                border-radius: 10px;
            }

            h1 {
                font-size: 28px;
                margin: 8px 0 20px;
            }

            h2 {
                font-size: 22px;
                margin-top: 24px;
            }

            h3 {
                font-size: 19px;
            }

            form,
            .team-controls form {
                display: flex;
                flex-direction: column;
                width: 100%;
                gap: 10px;
            }

            input,
            textarea,
            select,
            button {
                width: 100%;
                min-height: 48px;
                box-sizing: border-box;
                font-size: 17px;
                padding: 12px;
                margin: 0;
            }

            textarea {
                min-height: 110px;
            }

            button {
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent;
            }

            .team-controls {
                padding: 12px;
                margin-top: 15px;
            }

            .team-controls input,
            .team-controls select {
                min-width: 0;
                width: 100%;
            }

            .teams {
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin-top: 15px;
            }

            .team {
                width: 100%;
                min-width: 0;
                box-sizing: border-box;
                padding: 14px;
            }

            .team ul {
                padding-left: 22px;
                margin-bottom: 12px;
            }

            .team li {
                margin-bottom: 8px;
                overflow-wrap: anywhere;
            }

            .team li button {
                width: auto;
                min-width: 80px;
                min-height: 42px;
                margin-left: 5px;
                padding: 8px 12px;
                font-size: 15px;
            }

            .score {
                font-size: 40px;
                margin: 12px 0;
            }

            .team button {
                margin-top: 5px;
            }

            .rotation {
                width: 100%;
                margin-top: 15px;
            }

            .itinerary-item {
                padding: 13px;
                margin-top: 10px;
                overflow-wrap: anywhere;
            }

            #matchups {
                width: 100%;
            }

            /* Makes date/time controls easier to use on phones */
            input[type="date"],
            input[type="time"] {
                min-height: 50px;
            }
        }

        /* Extra-small phones */
        @media (max-width: 380px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 12px;
            }

            h1 {
                font-size: 25px;
            }

            h2 {
                font-size: 20px;
            }

            input,
            textarea,
            select,
            button {
                font-size: 16px;
            }
        }


        .mobile-only-tools {
            display: none;
        }

        @media (max-width: 700px) {
            .mobile-only-tools {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin: 0 0 18px;
                padding: 10px 12px;
                background: #f7f7f7;
                border-radius: 8px;
                font-size: 14px;
                text-align: center;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>School Soccer</h1>

    <!-- ITINERARY -->
    <h2>Itinerary</h2>

    <form id="itineraryForm">

        <input
            type="text"
            id="day"
            placeholder="Day"
            required
        >

        <input
            type="date"
            id="date"
            required
        >

        <input
            type="time"
            id="time"
            required
        >

        <input
            type="text"
            id="activity"
            placeholder="Activity"
            required
        >

        <input
            type="text"
            id="location"
            placeholder="Location"
            required
        >

        <input
            type="text"
            id="coach"
            placeholder="Coach"
            required
        >

        <textarea
            id="notes"
            placeholder="Notes"
        ></textarea>

        <button type="submit">
            Add Itinerary Item
        </button>

    </form>


    <!-- DISPLAY ITINERARY -->
    <h2>School Soccer Itinerary</h2>

    <div id="itineraryList"></div>


    <!-- TEAMS -->
    <h2>Teams</h2>

    <section class="team-controls">
        <form id="teamForm">
            <input type="text" id="teamName" placeholder="Team name" required>
            <input type="text" id="teamPlayers" placeholder="Players separated by commas">
            <button type="submit">Add Team</button>
        </form>

        <form id="playerForm">
            <select id="teamSelect" required></select>
            <input type="text" id="newPlayers" placeholder="Add players separated by commas" required>
            <button type="submit">Add Players</button>
        </form>
    </section>

    <div class="teams" id="teamsDisplay"></div>

    <button class="rotation" onclick="randomizeMatchups()">
        Randomize Matchups
    </button>
    
    <div id="matchups"></div>

    <button onclick="deleteTeam($,{index})">
    Delete Team
    </button>
</div>


<script>

    // -----------------------------
    // DATA
    // -----------------------------

    let Teams = ["Team A", "Team B"];

    let Scores = [0, 0];

    let players = {
        "Team A": ["Player 1", "Player 2", "Player 3"],
        "Team B": ["Player 4", "Player 5", "Player 6"]
    };

    let school_soccer_itinerary = [];


    // -----------------------------
    // ADD TEAMS AND PLAYERS
    // -----------------------------

    function normalizePlayerNames(input) {
        return input
            .split(",")
            .map(name => name.trim())
            .filter(name => name.length > 0);
    }

    function updateScore(teamIndex, points) {
        Scores[teamIndex] += points;

        if (Scores[teamIndex] < 0) {
            Scores[teamIndex] = 0;
        }

        updateTeams();
    }

    document.getElementById("teamForm").addEventListener("submit", function(event) {
        event.preventDefault();

        let teamName = document.getElementById("teamName").value.trim();
        let teamPlayers = normalizePlayerNames(document.getElementById("teamPlayers").value);

        if (!teamName) {
            return;
        }

        if (!players[teamName]) {
            Teams.push(teamName);
            players[teamName] = [];
            Scores.push(0);
        }

        players[teamName] = players[teamName].concat(teamPlayers);

        document.getElementById("teamForm").reset();
        updateTeams();
    });

    document.getElementById("playerForm").addEventListener("submit", function(event) {
        event.preventDefault();

        let teamName = document.getElementById("teamSelect").value;
        let newPlayers = normalizePlayerNames(document.getElementById("newPlayers").value);

        if (!teamName || newPlayers.length === 0) {
            return;
        }

        players[teamName] = players[teamName].concat(newPlayers);

        document.getElementById("playerForm").reset();
        updateTeams();
    });


    // -----------------------------
    // ADD ITINERARY ITEM
    // -----------------------------

    document
        .getElementById("itineraryForm")
        .addEventListener("submit", function(event) {

            // Prevent the page from refreshing
            event.preventDefault();

            let item = {
                day: document.getElementById("day").value,
                date: document.getElementById("date").value,
                time: document.getElementById("time").value,
                activity: document.getElementById("activity").value,
                location: document.getElementById("location").value,
                coach: document.getElementById("coach").value,
                notes: document.getElementById("notes").value
            };

            school_soccer_itinerary.push(item);

            // Show the itinerary
            showItinerary();

            // Clear the form
            document.getElementById("itineraryForm").reset();
        });


    // -----------------------------
    // SHOW ITINERARY
    // -----------------------------

    function showItinerary() {

        let list = document.getElementById("itineraryList");

        // Clear the existing display
        list.innerHTML = "";

        school_soccer_itinerary.forEach(function(item) {

            let div = document.createElement("div");

            div.className = "itinerary-item";

            div.innerHTML = `
                <strong>
                    ${item.day} ${item.date}
                </strong>

                <br>

                ${item.time} |
                ${item.activity} |
                ${item.location}

                <br>

                Coach: ${item.coach}

                <br>

                <strong>Notes:</strong>
                ${item.notes}
            `;

            list.appendChild(div);
        });
    }

    function deleteTeam(teamIndex) {

        let teamName = Teams[teamIndex];

        // Remove the team
        Teams.splice(teamIndex, 1);

        // Remove the score
        Scores.splice(teamIndex, 1);

        // Remove the players
        delete players[teamName];

        updateTeams();
    }
    // -----------------------------
    // ROTATE TEAMS
    // -----------------------------

    function randomizeMatchups() {

        // Make a copy so we don't change the actual Teams array
        let shuffledTeams = [...Teams];

        // Shuffle the teams randomly
        shuffledTeams.sort(() => Math.random() - 0.5);

        let matchups = document.getElementById("matchups");

        matchups.innerHTML = "<h2>Matchups</h2>";

        for (let i = 0; i < shuffledTeams.length; i += 2) {

            let matchup = document.createElement("div");
            matchup.className = "itinerary-item";

            if (shuffledTeams[i + 1]) {
                matchup.innerHTML = `
                    <strong>
                        ${shuffledTeams[i]} vs ${shuffledTeams[i + 1]}
                    </strong>
                `;
            } else {
                matchup.innerHTML = `
                    <strong>
                        ${shuffledTeams[i]} has a BYE
                    </strong>
                `;
            }

            matchups.appendChild(matchup);
        }
    }
    function deletePlayer(teamName, playerIndex) {

        players[teamName].splice(playerIndex, 1);

        updateTeams();
}
    // -----------------------------
    // UPDATE TEAM DISPLAY
    // -----------------------------

    function updateTeams() {
        let teamsDisplay = document.getElementById("teamsDisplay");
        teamsDisplay.innerHTML = "";

        Teams.forEach(function(teamName, index) {
            let teamDiv = document.createElement("div");
            teamDiv.className = "team";

            let teamScore = Scores[index] || 0;
            let teamPlayers = players[teamName] || [];

            teamDiv.innerHTML = `
                <h3>${teamName}</h3>

                <p>Players:</p>

                <ul>
                    ${teamPlayers.map((player, playerIndex) => `
                        <li>
                            ${player}
                            <button onclick="deletePlayer('${teamName}', ${playerIndex})">
                                Delete
                            </button>
                        </li>
                    `).join("")}
                </ul>

                <p class="score">${teamScore}</p>

                <button onclick="updateScore(${index}, 1)">
                    +1 Point
                </button>

                <button onclick="updateScore(${index}, -1)">
                    -1 Point
                </button>
            `;

            teamsDisplay.appendChild(teamDiv);
        });

        let teamSelect = document.getElementById("teamSelect");
        teamSelect.innerHTML = Teams.map(team => `<option value="${team}">${team}</option>`).join("");
    }

    updateTeams();

</script>

</body>
</html>
